<style>
:root{
  --marine:#1B2A4A; --marine-light:#EEF1F6;
  --bordeaux:#9E2B25; --bordeaux-light:#FBEDEC;
  --creme:#FAF9F6; --ardoise:#41454C; --muted:#6B6E73;
  --vert:#2F9E5C; --vert-light:#EAF6EF;
  --dore:#D4A23C; --dore-light:#FBF4E4;
  --border:#E4E1D8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--creme); min-height: 100vh; color: var(--ardoise); }
.container { max-width: 700px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 0; border-bottom: 2px solid var(--marine); margin-bottom: 1.5rem; }
.nav-left { font-family:'Newsreader',serif; font-size: 22px; font-weight: 500; color: var(--marine); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: white; color: var(--ardoise); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; font-family:'Inter',sans-serif; }
.btn:hover { background: var(--creme); }
.empty { text-align: center; color: var(--muted); padding: 3rem; }
.loader { text-align: center; color: var(--muted); padding: 3rem; }
.tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; background: white; border-radius: 11px; padding: 4px; border: 1px solid var(--border); }
.tab { flex: 1; padding: 9px; border-radius: 8px; border: none; background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); transition: all 0.15s; font-family:'Inter',sans-serif; }
.tab.active { background: var(--marine); color: white; }
.section-label { font-family:'IBM Plex Mono',monospace; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 1.75rem 0 10px; }
.dernier { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 1.5rem; }
.dernier-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dernier-tete .section-label { margin: 0; }
.dernier-date { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dernier-titre { font-family:'Newsreader',serif; font-size: 20px; font-weight: 600; color: var(--marine); margin-top: 8px; overflow-wrap: anywhere; }
.dernier-phrase { font-size: 13px; color: var(--ardoise); margin-top: 4px; line-height: 1.45; }
.niv-wrap { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.niv-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.niv-table th { font-family:'IBM Plex Mono',monospace; font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; text-align: center; padding: 9px 4px; border-bottom: 1px solid var(--border); background: var(--creme); }
.niv-table th.niv-col-nom { width: 34%; text-align: left; padding-left: 12px; }
.niv-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; font-size: 11.5px; line-height: 1.3; }
.niv-table tr:last-child td { border-bottom: none; }
.niv-table td.niv-nom { text-align: left; padding-left: 12px; overflow-wrap: anywhere; }
.niv-st { font-size: 13px; font-weight: 600; color: var(--ardoise); }
.niv-theme { font-size: 11px; color: var(--muted); margin-top: 2px; }
.niv-cell { border-radius: 8px; padding: 6px 4px; margin: 0 3px; }
.niv-acquis { background: var(--vert-light); color: #1f7a45; font-weight: 600; }
.niv-encours { background: var(--dore-light); color: #8a6416; }
.niv-jamais { background: var(--creme); color: var(--muted); }
.niv-verrou { background: var(--creme); color: var(--muted); opacity: .8; }
.niv-barre { height: 4px; background: rgba(0,0,0,.08); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.niv-barre > span { display: block; height: 100%; background: var(--dore); border-radius: 2px; }
.niv-resume { font-size: 13px; color: var(--ardoise); margin-bottom: 10px; }
.niv-legende { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
.niv-legende span { white-space: nowrap; margin-right: 10px; }
.niv-erreur { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1rem; text-align: center; color: var(--muted); font-size: 13px; }
.niv-pas-commences { margin-top: 14px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.niv-pas-commences summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ardoise); }
.niv-pc-theme { font-size: 12px; font-weight: 600; color: var(--ardoise); margin-top: 10px; }
.niv-pc-liste { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
.footer-btns { margin-top: 1.75rem; }
.btn-green { display: block; text-align: center; text-decoration: none; background: var(--bordeaux); color: white; font-size: 15px; font-weight: 600; padding: 15px; border-radius: 11px; }
.jour-sep { display: flex; align-items: center; gap: 10px; margin: 1.5rem 0 10px; }
.jour-sep:first-child { margin-top: 0; }
.jour-sep-label { font-family:'IBM Plex Mono',monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.jour-sep-line { flex: 1; height: 1px; background: var(--border); }
.hist-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 16px; margin-bottom: 10px; }
.hist-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hist-theme { font-size: 13.5px; font-weight: 600; color: var(--ardoise); }
.hist-badge { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; background: var(--marine-light); color: var(--marine); margin-left: 6px; font-weight: 500; }
.hist-date { font-size: 11px; color: var(--muted); margin-top: 3px; }
.hist-score { font-family:'Newsreader',serif; font-size: 22px; font-weight: 600; }
.hist-score.bon { color: var(--vert); }
.hist-score.moyen { color: #8a6416; }
.hist-score.faible { color: var(--bordeaux); }
.hist-score.abandon { color: var(--muted); font-family:'Inter',sans-serif; font-size: 13px; font-weight: 600; }
.hist-ratees { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.hist-ratees-label { font-size: 11px; color: var(--bordeaux); font-weight: 600; margin-bottom: 5px; }
.hist-ratee { font-size: 12px; color: var(--muted); padding: 2px 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width:480px){
  .container{padding:1rem 1rem 2rem}
  .niv-table td{font-size:11px}
  .niv-st{font-size:12.5px}
}

<script>
const SUPABASE_URL = 'https://vkkgadwqumqqwpaayjac.supabase.co'
const SUPABASE_KEY = 'sb_publishable_3nwxCHSPliLzSB6B7BZYhw__sp7ToXI'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

// Grille alignée sur le référentiel Eduscol (5 thèmes cycle 4) — migrée
// depuis les 4 anciens domaines le 19/08/2026. Doit rester identique à
// quiz.html et prof.html (même valeurs, même icônes).
const THEMES = [
  { label: 'Nombres et calculs',        value: 'Nombres et calculs',                          icon: 'calc' },
  { label: 'Organisation et données',   value: 'Organisation et gestion de données, fonctions', icon: 'bar' },
  { label: 'Grandeurs et mesures',      value: 'Grandeurs et mesures',                         icon: 'ruler' },
  { label: 'Espace et géométrie',       value: 'Espace et géométrie',                          icon: 'tri' },
  { label: 'Algorithmique',             value: 'Algorithmique et programmation',               icon: 'algo' },
]

const THEME_ICONS = {
  calc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="9" cy="13" r="1.1"/><circle cx="15" cy="13" r="1.1"/><circle cx="9" cy="17" r="1.1"/><circle cx="15" cy="17" r="1.1"/></svg>',
  bar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="14" width="3" height="6"/><rect x="11" y="9" width="3" height="11"/><rect x="16" y="5" width="3" height="15"/></svg>',
  tri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5 L5 20 L20 20 Z"/><rect x="5" y="16.5" width="3.5" height="3.5"/></svg>',
  ruler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1" transform="rotate(-8 12 12)"/><line x1="6.5" y1="9" x2="7" y2="11.3" transform="rotate(-8 12 12)"/><line x1="10" y1="8.4" x2="10.5" y2="10.7" transform="rotate(-8 12 12)"/><line x1="13.5" y1="7.8" x2="14" y2="10.1" transform="rotate(-8 12 12)"/><line x1="17" y1="7.2" x2="17.5" y2="9.5" transform="rotate(-8 12 12)"/></svg>',
  algo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/></svg>'
}

function getStatut(pct) {
  if (pct >= 70) return { label: 'Maîtrisé', emoji: '🟢', color: 'var(--vert)', classe: 'bon' }
  if (pct >= 50) return { label: 'En cours', emoji: '🟡', color: '#8a6416', classe: 'moyen' }
  return { label: 'À retravailler', emoji: '🔴', color: 'var(--bordeaux)', classe: 'faible' }
}

// Échappement HTML de toute valeur issue de la base injectée dans innerHTML
// (TODO n°41). Même contrat que esc() de api/email.js.
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function dayLabel(dateStr) {
  const d = new Date(dateStr)
  const now = new Date()
  const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate())
  const nOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate())
  const diffJours = Math.round((nOnly - dOnly) / 86400000)
  if (diffJours === 0) return "Aujourd'hui"
  if (diffJours === 1) return 'Hier'
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: dOnly.getFullYear() !== nOnly.getFullYear() ? 'numeric' : undefined })
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('active', (i === 0 && tab === 'dashboard') || (i === 1 && tab === 'historique'))
  })
  document.getElementById('tab-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none'
  document.getElementById('tab-historique').style.display = tab === 'historique' ? 'block' : 'none'
}

async function init() {
  var session = await sb.auth.getSession()
  if (!session.data.session) { window.location.href = 'index.html'; return }
  var user = session.data.session.user

  // Gate comptes orphelins (cf. docs/TODO.md) : resultats.html réservé aux
  // comptes élèves (ligne profils) et au prof (app_metadata, jamais
  // user_metadata). Fail-open si la lecture échoue techniquement — jamais
  // silencieux. resultats.html ne chargeait profils nulle part avant ce
  // correctif.
  var profilRes = await sb.from('profils').select('user_id').eq('user_id', user.id).limit(1)
  if (profilRes.error) {
    console.log('[gate profils] lecture échouée, gate non appliqué :', profilRes.error.message)
  } else if (user.app_metadata?.role !== 'prof' && (!profilRes.data || profilRes.data.length === 0)) {
    window.location.href = 'suivi-parent.html?from=gate'; return
  }

  var res = await sb.from('resultats').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
  var rows = res.data
  if (!rows || rows.length === 0) {
    document.getElementById('tab-dashboard').innerHTML = '<div class="empty">Pas encore de résultats.<br>Lance ton premier quiz !</div>'
    document.getElementById('tab-historique').innerHTML = '<div class="empty">Pas encore de résultats.<br>Lance ton premier quiz !</div>'
    return
  }
  // Niveaux par sous-thème : règle de déblocage unique, définie dans la vue
  // niveaux_sous_theme (db/vue-niveaux.sql). Une erreur ne bloque que le
  // tableau : le reste de la page s'affiche normalement.
  var niv = await sb.from('niveaux_sous_theme')
    .select('theme, sous_theme, f_reussites, m_reussites, d_reussites, f_etat, m_etat, d_etat, niveau_courant, derniere_session')
    .eq('user_id', user.id)
  if (niv.error) console.error('[niveaux] lecture de niveaux_sous_theme impossible :', niv.error.message)
  renderDashboard(niv.error ? null : (niv.data || []))
  renderHistorique(rows)
}

// Libellé court du thème (THEMES), thème brut si inconnu (ancien libellé).
function libelleTheme(valeur) {
  var t = THEMES.find(function(x) { return x.value === valeur })
  return t ? t.label : valeur
}

function reussites(n) {
  n = Math.min(Number(n) || 0, 5)
  return n + ' réussite' + (n > 1 ? 's' : '') + ' sur 5'
}

// Une case du tableau selon l'état du niveau (calculé par la vue).
function celluleNiveau(etat, nbReussites) {
  if (etat === 'acquis') return '<div class="niv-cell niv-acquis">✓ Acquis</div>'
  if (etat === 'en_cours') {
    var n = Math.min(Number(nbReussites) || 0, 5)
    return '<div class="niv-cell niv-encours">' + reussites(n) +
      '<div class="niv-barre"><span style="width:' + (n * 20) + '%"></span></div></div>'
  }
  if (etat === 'jamais_joue') return '<div class="niv-cell niv-jamais">' + reussites(0) + '</div>'
  return '<div class="niv-cell niv-verrou">🔒 Verrouillé</div>'
}

const NOM_NIVEAU = { facile: 'Facile', moyen: 'Moyen', difficile: 'Difficile' }

// Bloc « Dernier sous-thème travaillé » : ligne de la vue la plus récente.
function renderDernierSousTheme(l) {
  var acquis = l.d_etat === 'acquis'
  var niveau = NOM_NIVEAU[l.niveau_courant] || ''
  var nb = { facile: l.f_reussites, moyen: l.m_reussites, difficile: l.d_reussites }[l.niveau_courant]
  var n = Math.min(Number(nb) || 0, 5)
  var r = 5 - n
  var phrase
  if (acquis) phrase = 'Les 3 niveaux sont acquis. Bravo !'
  else if (l.niveau_courant === 'facile') phrase = reussites(n) + '. Encore ' + r + ' pour débloquer le niveau Moyen.'
  else if (l.niveau_courant === 'moyen') phrase = reussites(n) + '. Encore ' + r + ' pour débloquer le niveau Difficile.'
  else phrase = reussites(n) + '. Encore ' + r + ' pour acquérir le niveau Difficile.'

  var html = '<div class="dernier">'
  html += '<div class="dernier-tete"><div class="section-label">Dernier sous-thème travaillé</div>' +
    '<div class="dernier-date">' + esc(dayLabel(l.derniere_session)) + '</div></div>'
  html += '<div class="dernier-titre">' + esc(l.sous_theme) + (acquis || !niveau ? '' : ' · ' + esc(niveau)) + '</div>'
  html += '<div class="dernier-phrase">' + phrase + '</div>'
  if (!acquis) html += '<div class="niv-barre" style="height:6px;margin-top:10px"><span style="width:' + (n * 20) + '%"></span></div>'
  return html + '</div>'
}

function renderNiveaux(niveaux) {
  var html = '<div class="section-label">Mes niveaux par sous-thème</div>'
  if (niveaux === null) {
    return html + '<div class="niv-erreur">Impossible d\'afficher tes niveaux pour le moment.</div>'
  }

  var total = Object.keys(SOUS_THEMES).reduce(function(s, t) { return s + SOUS_THEMES[t].length }, 0)
  var lignes = niveaux.slice().sort(function(a, b) {
    return new Date(b.derniere_session || 0) - new Date(a.derniere_session || 0)
  })
  if (lignes.length > 0) html = renderDernierSousTheme(lignes[0]) + html
  var commences = {}
  lignes.forEach(function(l) { commences[l.theme + '||' + l.sous_theme] = true })

  html += '<div class="niv-resume">' + lignes.length + ' sous-thème' + (lignes.length > 1 ? 's' : '') +
    ' commencé' + (lignes.length > 1 ? 's' : '') + ' sur ' + total + '</div>'

  if (lignes.length > 0) {
    html += '<div class="niv-wrap"><table class="niv-table"><thead><tr>' +
      '<th class="niv-col-nom" scope="col">Sous-thème</th>' +
      '<th scope="col">Facile</th><th scope="col">Moyen</th><th scope="col">Difficile</th></tr></thead><tbody>'
    lignes.forEach(function(l) {
      html += '<tr><td class="niv-nom"><div class="niv-st">' + esc(l.sous_theme) + '</div>' +
        '<div class="niv-theme">' + esc(libelleTheme(l.theme)) + '</div></td>' +
        '<td>' + celluleNiveau(l.f_etat, l.f_reussites) + '</td>' +
        '<td>' + celluleNiveau(l.m_etat, l.m_reussites) + '</td>' +
        '<td>' + celluleNiveau(l.d_etat, l.d_reussites) + '</td></tr>'
    })
    html += '</tbody></table></div>'
    html += '<div class="niv-legende">' +
      '<span>✓ Acquis = 5 réussites</span><span>En cours</span><span>🔒 Verrouillé</span><br>' +
      'Réussite : au moins 4 bonnes réponses sur 5</div>'
  }

  var pasCommences = []
  Object.keys(SOUS_THEMES).forEach(function(t) {
    var absents = SOUS_THEMES[t].filter(function(st) { return !commences[t + '||' + st] })
    if (absents.length) pasCommences.push({ theme: t, sousThemes: absents })
  })
  var k = pasCommences.reduce(function(s, g) { return s + g.sousThemes.length }, 0)
  if (k > 0) {
    html += '<details class="niv-pas-commences"><summary>Pas encore commencés — ' + k + ' sous-thème' + (k > 1 ? 's' : '') + '</summary>'
    pasCommences.forEach(function(g) {
      html += '<div class="niv-pc-theme">' + esc(libelleTheme(g.theme)) + '</div>' +
        '<div class="niv-pc-liste">' + g.sousThemes.map(esc).join(' · ') + '</div>'
    })
    html += '</details>'
  }
  return html
}

function renderDashboard(niveaux) {
  var html = renderNiveaux(niveaux)
  html += '<div class="footer-btns"><a href="quiz.html" class="btn-green">💪 Continuer à réviser</a></div>'
  document.getElementById('tab-dashboard').innerHTML = html
}

// Libellé d'une question ratée : retire le préfixe « thème — » (cf. api/quiz-resultat.js)
// et ne laisse pas un énoncé tronqué à 40 caractères s'arrêter en plein mot
// (un dernier morceau qui n'est pas un mot est conservé).
// Un préfixe « X — » est aussi retiré quand X est l'un des domaines de
// SOUS_THEMES (js/catalogue.js), même si r.theme diffère ; jamais un « — »
// ailleurs dans le texte. Toute entrée hors de ce format est rendue telle quelle.
function libelleRatee(q, theme) {
  q = String(q == null ? '' : q)
  var marque = ''
  if (q.indexOf('[Aucune idée] ') === 0) {
    marque = '[Aucune idée] '
    q = q.slice(marque.length)
  }
  var prefixe = theme ? theme + ' — ' : ''
  if (prefixe && q.indexOf(prefixe) === 0) {
    q = q.slice(prefixe.length)
  } else {
    var domaine = Object.keys(SOUS_THEMES).find(function(d) { return q.indexOf(d + ' — ') === 0 })
    if (domaine) q = q.slice(domaine.length + 3)
  }
  if (q.length === 40) {
    // Le dernier morceau n'est retiré que s'il est un mot (lettres seules) :
    // un chiffre, un symbole ou une expression (« = 0 ») est gardé entier.
    var i = q.lastIndexOf(' ')
    if (i > 0 && /^[\p{L}'’-]+$/u.test(q.slice(i + 1))) q = q.slice(0, i)
    q += '…'
  }
  return marque + q
}

// Libellés des questions ratées d'une session. Détail non vide
// (questions_ratees_detail, cf. CLAUDE.md) : énoncé complet, dans l'ordre du
// détail ; sinon (NULL, [] ou ancienne session) : questions_ratees tronquées.
function libellesRatees(r) {
  var d = r.questions_ratees_detail
  if (Array.isArray(d) && d.length) {
    return d.map(function(e) {
      e = e || {}
      return (e.aucune_idee === true ? '[Aucune idée] ' : '') + String(e.enonce == null ? '' : e.enonce)
    })
  }
  if (r.questions_ratees && r.questions_ratees.length) {
    return r.questions_ratees.map(function(q) { return libelleRatee(q, r.theme) })
  }
  return []
}

function renderHistorique(rows) {
  var html = ''
  var dernierJour = null
  rows.forEach(function(r) {
    var jour = dayLabel(r.created_at)
    if (jour !== dernierJour) {
      html += '<div class="jour-sep"><span class="jour-sep-label">' + esc(jour) + '</span><span class="jour-sep-line"></span></div>'
      dernierJour = jour
    }
    var heure = new Date(r.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    var themeCourt = libelleTheme(r.theme)
    var sousTheme = r.sous_theme && String(r.sous_theme).trim()
    var titre = esc(sousTheme ? r.sous_theme : themeCourt)
    var sousTitre = (sousTheme ? esc(themeCourt) + ' · ' : '') + heure
    var ratees = '', scoreHtml
    if (r.abandonne) {
      // Score forcé à 0 côté serveur sur un abandon (cf. api/quiz-resultat.js) :
      // ni un score réel à afficher, ni une "question ratée" à lister — le
      // placeholder questions_ratees:['Quiz abandonné'] n'en est pas une.
      scoreHtml = '<div class="hist-score abandon">Abandonné</div>'
    } else {
      var pct = Math.round((r.score / r.total) * 100)
      var statut = getStatut(pct)
      scoreHtml = '<div class="hist-score ' + statut.classe + '">' + esc(r.score) + '/' + esc(r.total) + '</div>'
      var lib = libellesRatees(r)
      if (lib.length) {
        ratees = '<div class="hist-ratees"><div class="hist-ratees-label">Question' + (lib.length > 1 ? 's ratées' : ' ratée') + '</div>' + lib.map(function(l) { return '<div class="hist-ratee">• ' + esc(l) + '</div>' }).join('') + '</div>'
      }
    }
    html += '<div class="hist-card">' +
      '<div class="hist-top">' +
      '<div><span class="hist-theme">' + titre + '</span><span class="hist-badge">' + esc(r.difficulte) + '</span><div class="hist-date">' + sousTitre + '</div></div>' +
      scoreHtml +
      '</div>' + ratees + '</div>'
  })
  document.getElementById('tab-historique').innerHTML = html
}

init()
</script>
