<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }
.container { max-width: 680px; margin: 0 auto; padding: 1rem; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #e8e8e4; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 8px; }
.nav-left { font-size: 18px; font-weight: 600; }

.card { background: white; border-radius: 12px; border: 1px solid #e8e8e4; padding: 1.25rem; margin-bottom: 1rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid #d0d0c8; background: white; color: #1a1a1a; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; }
.btn:hover { background: #f5f5f0; }
.btn-primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-green { background: #16a34a; color: white; border-color: #16a34a; font-size: 15px; padding: 14px; }
.btn-green:hover { background: #15803d; }
.btn-red { background: #dc2626; color: white; border-color: #dc2626; font-size: 15px; padding: 14px; animation: pulse-btn 1s infinite; }
.btn-red:hover { background: #b91c1c; }
@keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.85} }

.btn-outline:hover { background: #f5f5f0; }
.btn-full { width: 100%; }
.option { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid #e8e8e4; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.15s; margin-bottom: 8px; }
.option:hover { border-color: #999; background: #f9f9f7; }
.option.selected { border-color: #3730a3; background: #eef2ff; }
.option.correct { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
.option.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
.letter { font-size: 12px; font-weight: 600; color: #999; min-width: 18px; }
.option.correct .letter, .option.wrong .letter { color: inherit; }
.explication { margin-top: 10px; padding: 10px 14px; background: #f5f5f0; border-radius: 8px; font-size: 13px; color: #555; border-left: 3px solid #3730a3; line-height: 1.6; }
.badge-theme { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #f5f5f0; color: #666; border: 1px solid #e0e0d8; }
.badge-partie { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #eef2ff; color: #3730a3; border: 1px solid #3730a3; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #eef2ff; color: #3730a3; }
.q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
.q-num { font-size: 12px; color: #999; }
.q-text { font-size: 15px; line-height: 1.8; margin-bottom: 10px; color: #1a1a1a; }
.q-tableau { border-collapse: collapse; margin: 10px 0 14px 0; font-size: 14px; width: 100%; }
.q-tableau th { border: 1px solid #ccc; padding: 6px 14px; background: #f5f5f0; font-weight: 600; text-align: center; }
.q-tableau td { border: 1px solid #ccc; padding: 6px 14px; text-align: center; }
.loader { text-align: center; padding: 3rem; color: #666; font-size: 14px; }
.chrono { display: flex; align-items: center; gap: 8px; background: white; border: 1px solid #e8e8e4; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: #1a1a1a; }
.chrono-dot { width: 8px; height: 8px; background: #dc2626; border-radius: 50%; animation: pulse 1s infinite; }
.chrono-warning { border-color: #dc2626 !important; color: #dc2626 !important; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.progress-bar-wrap { background: #e0e0d8; border-radius: 4px; height: 8px; margin-bottom: 1.5rem; }
.progress-bar { background: #3730a3; height: 8px; border-radius: 4px; transition: width 0.3s; }
.progress-label { font-size: 12px; color: #666; margin-bottom: 6px; display: flex; justify-content: space-between; }
.intro-card { background: white; border-radius: 16px; border: 1px solid #e8e8e4; padding: 2rem 1.5rem; margin-bottom: 1rem; text-align: center; }
.intro-icon { font-size: 48px; margin-bottom: 1rem; }
.intro-title { font-size: 22px; font-weight: 700; margin-bottom: 0.5rem; }
.intro-sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; line-height: 1.6; }
.intro-rules { background: #f5f5f0; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; text-align: left; }
.intro-rules li { font-size: 13px; color: #555; margin-bottom: 6px; list-style: none; padding-left: 4px; }
.intro-deroulement { background: #eef2ff; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; text-align: left; border-left: 3px solid #3730a3; }
.intro-deroulement p { font-size: 13px; color: #3730a3; line-height: 1.7; }
.results-screen { background: white; border-radius: 16px; border: 1px solid #e8e8e4; padding: 2rem 1.5rem; margin-bottom: 1rem; text-align: center; }
.results-score-big { font-size: 72px; font-weight: 700; color: #1a1a1a; line-height: 1; }
.results-pct { font-size: 28px; font-weight: 600; margin: 10px 0 6px; }
.results-mention { font-size: 20px; margin-bottom: 0.5rem; }
.results-temps { font-size: 12px; color: #999; margin-bottom: 0.5rem; }
.results-mention-officielle { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 1.5rem; }
.mention-tb { background: #f0fdf4; color: #16a34a; border: 1px solid #16a34a; }
.mention-b { background: #eef2ff; color: #3730a3; border: 1px solid #3730a3; }

.mention-insuffisant { background: #fef2f2; color: #dc2626; border: 1px solid #dc2626; }
.results-btns { display: flex; flex-direction: column; gap: 10px; }
.themes-recap { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 1rem 0; }
.theme-score { background: #f5f5f0; border-radius: 8px; padding: 10px; text-align: center; font-size: 12px; }
.theme-score-num { font-size: 20px; font-weight: 700; }
.theme-score-label { color: #666; margin-top: 2px; font-size: 11px; }
.historique-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0ec; font-size: 13px; }
.alerte-ecoule { background: #fef2f2; border: 1px solid #dc2626; border-radius: 10px; padding: 12px 16px; text-align: center; color: #dc2626; font-weight: 600; font-size: 14px; margin-bottom: 1rem; }
.toast { position: fixed; bottom: 80px; right: 16px; z-index: 1000; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; color: white; max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transform: translateX(120%); transition: transform 0.3s ease; }
.toast.show { transform: translateX(0); }
.toast-orange { background: #f59e0b; }
.toast-red { background: #dc2626; }
.sticky-btn { position: sticky; bottom: 1rem; padding: 0.5rem 0; }
.q-figure { margin: 10px 0 14px; display: flex; justify-content: center; background: #f9f9f7; border-radius: 8px; padding: 12px; }
.q-figure svg { max-width: 260px; height: auto; display: block; }
</style>

<div class="container">
<nav>
  <div class="nav-left">∑ ACADEMIKA</div>
  <div class="nav-right">
    <span class="nav-email" id="user-email"></span>
    <div class="chrono" id="chrono" style="display:none">
      <div class="chrono-dot"></div>
      <span id="chrono-text">40:00</span>
    </div>
    <button class="btn" onclick="retourAccueil()">← Accueil</button>
    <button class="btn" onclick="logout()">Déconnexion</button>
  </div>
</nav>
<div id="main-area"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL = 'https://vkkgadwqumqqwpaayjac.supabase.co'
const SUPABASE_KEY = 'sb_publishable_3nwxCHSPliLzSB6B7BZYhw__sp7ToXI'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
let user=null, prenom='', nom='', emailParent=''
let questions=[], answers={}, saved=false
let chronoInterval=null, chronoSecondes=0
let examEnCours=false
let heureFin=null
let correction={}
let resultatServeur=null
// accessToken : tenu à jour via onAuthStateChange (pas juste initialisé à
// init()) car il sert dans pagehide, où on ne peut pas attendre un
// getSession() async — sans ça, un abandon après expiration/renouvellement
// du jeton en cours d'examen échouerait en 401.
let accessToken=null
let tentativeId=null
// Un seul toast tant que la sauvegarde en arrière-plan échoue en boucle —
// évite un toast à chaque pick() si la session reste invalide plusieurs
// questions de suite. Remis à false dès qu'une sauvegarde réussit à nouveau.
let progressionEnEchec=false

// beforeunload : dialogue de confirmation UNIQUEMENT. Ne pas y appeler
// sauvegarderAbandonne() — ce handler se déclenche avant que l'utilisateur
// ait répondu, donc un clic sur "Annuler" (qui garde la page ouverte)
// enregistrerait quand même l'examen comme abandonné. L'écriture réelle est
// déportée sur pagehide, qui ne se déclenche que si la page se décharge
// effectivement. Même correctif que quiz.html (PR #81).
window.addEventListener('beforeunload', function(e) {
  if(examEnCours&&!saved){e.preventDefault();e.returnValue='⚠️ Examen en cours !'}
})

// pagehide : event.persisted=true signifie mise en cache bfcache (retour
// possible via le bouton précédent), pas un vrai déchargement — ne pas
// sauvegarder l'abandon dans ce cas.
window.addEventListener('pagehide', function(e) {
  if(!e.persisted&&examEnCours&&!saved){sauvegarderAbandonne()}
})

function construireReponses(){
  return questions.map(function(q, i) {
    return { id: q.id, choix: answers[i] !== undefined ? answers[i] : null }
  })
}

// Point d'entrée unique vers /api/examen pour demarrer/progression/reprise/
// enregistrer (PAS pour l'abandon pagehide, cf. sauvegarderAbandonne() plus
// bas) : sur un 401, tente sb.auth.refreshSession() puis rejoue l'appel une
// seule fois avec le jeton renouvelé. accessToken est mis à jour en mémoire
// dans les deux cas (succès du rafraîchissement ici, ou déjà tenu à jour par
// onAuthStateChange) — c'est cette même variable que lit pagehide.
async function appelExamenApi(corps){
  const faireAppel = function(){
    return fetch('/api/examen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, corps, { access_token: accessToken }))
    })
  }
  let res = await faireAppel()
  if (res.status === 401) {
    try {
      const { data, error } = await sb.auth.refreshSession()
      if (!error && data && data.session && data.session.access_token) {
        accessToken = data.session.access_token
        res = await faireAppel()
      }
    } catch(e) { console.log('[auth] refreshSession a échoué :', e.message) }
  }
  return res
}

function afficherEcranReconnexion(){
  document.getElementById('main-area').innerHTML=
    '<div class="intro-card">'+
    '<div class="intro-icon">🔒</div>'+
    '<div class="intro-title">Session expirée</div>'+
    '<div class="intro-sub">Ta session a expiré et n\'a pas pu être renouvelée automatiquement. Reconnecte-toi pour continuer.</div>'+
    '<button onclick="seReconnecter()" class="btn btn-primary btn-full" style="font-size:16px;padding:14px">🔑 Se reconnecter</button>'+
    '</div>'
}

// Sans ce nettoyage, la session corrompue reste dans localStorage : sur
// connexion.html, sb.auth.getSession() la renvoie quand même comme
// "présente", et son propre gate (fail-open sur l'échec de lecture profils,
// provoqué par le même jeton corrompu) redirige alors directement vers
// quiz.html SANS jamais afficher le formulaire de connexion — boucle
// "Session expirée" constatée sur preview (22/09/2026). scope:'local' :
// n'invalide que la session de CET appareil, pas les autres sessions actives
// de l'élève.
async function seReconnecter(){
  try {
    const { error } = await sb.auth.signOut({ scope: 'local' })
    if (error) throw error
  } catch(e) {
    console.log('[reconnexion] signOut a échoué, nettoyage manuel du localStorage :', e.message)
    try {
      Object.keys(localStorage)
        .filter(function(k){ return k.startsWith('sb-') && k.endsWith('-auth-token') })
        .forEach(function(k){ localStorage.removeItem(k) })
    } catch(e2) { console.log('[reconnexion] nettoyage manuel a aussi échoué :', e2.message) }
  }
  window.location.href='connexion.html'
}

// pagehide UNIQUEMENT (cf. plus bas) : keepalive nécessaire pour survivre au
// déchargement de la page, donc PAS de passage par appelExamenApi ici — un
// refreshSession() (appel réseau supplémentaire) n'est pas fiable pendant un
// unload. Sans gravité si ce point échoue en 401 : les réponses sont déjà
// persistées par les progression() précédents, seul le marquage "abandonné"
// manquerait, de toute façon écrasé par la prochaine soumission réelle.
async function sauvegarderAbandonne() {
  if(saved||!user||questions.length===0)return
  try{
    const tempsSecondes=heureFin?Math.floor((40*60*1000-Math.max(0,heureFin-Date.now()))/1000):chronoSecondes
    await fetch('/api/examen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'enregistrer', abandonne: true,
        access_token: accessToken, tentative_id: tentativeId,
        email: user.email, prenom,
        reponses: construireReponses(), temps_secondes: tempsSecondes,
        client_key: crypto.randomUUID()
      }),
      keepalive: true
    })
    saved=true
  }catch(e){console.log('Erreur abandon:',e.message)}
}

// Abandon EXPLICITE et confirmé (retourAccueil()/logout(), après le
// confirm() ci-dessous) : pas de contrainte de déchargement de page ici
// (attendu avant la navigation), donc passe par appelExamenApi comme les
// autres actions — un jeton expiré au moment du clic ne doit pas faire
// échouer silencieusement l'abandon définitif. definitif=true supprime la
// ligne de progression côté serveur, la reprise ne sera plus proposée —
// cohérent avec le message affiché. Différent de l'abandon incertain via
// pagehide (F5, onglet fermé, crash), qui conserve la ligne.
async function envoyerAbandonDefinitif(){
  if(saved||!user||questions.length===0)return
  try{
    const tempsSecondes=heureFin?Math.floor((40*60*1000-Math.max(0,heureFin-Date.now()))/1000):chronoSecondes
    const res = await appelExamenApi({
      action: 'enregistrer', abandonne: true, definitif: true, tentative_id: tentativeId,
      email: user.email, prenom,
      reponses: construireReponses(), temps_secondes: tempsSecondes,
      client_key: crypto.randomUUID()
    })
    if (res.ok) saved=true
    else console.log('[abandon définitif] échec, statut', res.status)
  }catch(e){console.log('Erreur abandon:',e.message)}
}

async function retourAccueil() {
  if(examEnCours&&!saved){
    const ok=confirm('⚠️ Examen en cours. Si tu quittes, tu perdras ta progression. Continuer quand même ?')
    if(!ok)return
    examEnCours=false
    await envoyerAbandonDefinitif()
  }
  window.location.href='quiz.html'
}

async function init() {
  const {data}=await sb.auth.getSession()
  if(!data.session){window.location.href='index.html';return}
  user=data.session.user
  accessToken=data.session.access_token
  sb.auth.onAuthStateChange(function(event,session){ if(session&&session.access_token) accessToken=session.access_token })
  prenom=user.user_metadata?.prenom||''
  nom=user.user_metadata?.nom||''
  emailParent=user.user_metadata?.email_parent||''
  const {data:profil,error:errProfil}=await sb.from('profils').select('prenom_affiche,nom_affiche,email_parent').eq('user_id',user.id).limit(1)
  // Gate comptes orphelins (cf. docs/TODO.md) : examen.html réservé aux
  // comptes élèves (ligne profils) et au prof (app_metadata, jamais
  // user_metadata). Fail-open si la lecture échoue techniquement — jamais
  // silencieux.
  if(errProfil){console.log('[gate profils] lecture échouée, gate non appliqué :',errProfil.message)}
  else if(user.app_metadata?.role!=='prof'&&(!profil||profil.length===0)){window.location.href='suivi-parent.html?from=gate';return}
  if(profil&&profil.length>0){
    prenom=prenom||profil[0].prenom_affiche||''
    nom=nom||profil[0].nom_affiche||''
    emailParent=emailParent||profil[0].email_parent||''
  }
  document.getElementById('user-email').textContent=prenom||user.email
  await tenterReprise()
}

// Vérifie toujours côté serveur s'il existe une tentative en cours — pas de
// cache local (localStorage) : le serveur fait foi dans tous les cas, un
// cache n'aurait fait qu'ajouter une logique de purge sans rien éviter
// puisque cet appel a lieu systématiquement, cache ou pas.
async function tenterReprise() {
  document.getElementById('main-area').innerHTML='<div class="loader">⏳ Vérification d\'une tentative en cours…</div>'
  try {
    const res = await appelExamenApi({ action: 'reprise', email: user.email, prenom })
    if (res.status === 401) { afficherEcranReconnexion(); return }
    const data = await res.json()
    if (!data.success || !data.encours) { await renderIntro(); return }

    questions = data.questions
    tentativeId = data.tentative_id
    answers = {}
    ;(data.reponses||[]).forEach(function(r){
      const idx = questions.findIndex(function(q){ return q.id===r.id })
      if (idx!==-1 && r.choix!==null && r.choix!==undefined) answers[idx]=r.choix
    })

    if (data.soumisAuto) {
      // heure_fin dépassé pendant l'absence : le serveur a déjà soumis les
      // réponses enregistrées (pas un abandon à 0) et supprimé la ligne de
      // progression. On affiche directement l'écran résultats, comme une
      // fin normale.
      correction = data.correction
      resultatServeur = { nbOk: data.score, themes: data.themes, questionsRatees: data.questionsRatees, tempsSecondes: data.temps_secondes }
      saved=true; examEnCours=false
      renderResultats()
      return
    }

    saved=false;examEnCours=true;correction={};resultatServeur=null
    demarrerChrono(data.heure_fin ? new Date(data.heure_fin).getTime() : null)
    renderExamen()
  } catch(e) {
    console.log('[reprise] échec, écran d\'intro :', e.message)
    await renderIntro()
  }
}

function getMention(pct){
  if(pct>=80)return{label:'🌟 Excellent',cls:'mention-tb',officiel:'Excellent'}
  if(pct>=70)return{label:'👍 Très bon',cls:'mention-b',officiel:'Très bon'}
  if(pct>=60)return{label:'✅ Bon',cls:'mention-ab',officiel:'Bon'}
  if(pct>=50)return{label:'📋 Correct',cls:'mention-admis',officiel:'Correct'}
  return{label:'📚 À retravailler',cls:'mention-insuffisant',officiel:'À retravailler'}
}

function formatTemps(s){
  const m=Math.floor(s/60)
  const sec=s%60
  return m+' min '+sec+' sec'
}

let toastTimeout=null
function showToast(message, type) {
  const toast = document.getElementById('toast')
  toast.textContent = message
  toast.className = 'toast show ' + (type === 'rouge' ? 'toast-red' : 'toast-orange')
  if(toastTimeout) clearTimeout(toastTimeout)
  toastTimeout = setTimeout(function() {
    toast.classList.remove('show')
  }, 10000)
}

function renderTableau(tableau) {
  if (!tableau) return ''
  var t = tableau
  if (typeof t === 'string') { try { t = JSON.parse(t) } catch(e) { return '' } }
  if (!t || !t.headers || !t.rows) return ''
  return '<table class="q-tableau"><tr>' +
    t.headers.map(function(h){ return '<th>' + h + '</th>' }).join('') +
    '</tr>' +
    t.rows.map(function(row){ return '<tr>' + row.map(function(cell){ return '<td>' + cell + '</td>' }).join('') + '</tr>' }).join('') +
    '</table>'
}

function renderFigure(fig) {
  if (!fig || !fig.type) return ''
  var f = fig
  if (typeof f === 'string') { try { f = JSON.parse(f) } catch(e) { return '' } }
  if (!f || !f.type) return ''
  if (f.type === 'triangle_rect' && f.base === '?' && f.hauteur === '?') return ''
  const S = 220, P = 36
  const style = '<style>.fig-sh{fill:#eef2ff;stroke:#3730a3;stroke-width:1.5;stroke-linejoin:round}.fig-dm{fill:none;stroke:#3730a3;stroke-width:0.8;stroke-dasharray:3,2}.fig-lb{font-size:11px;fill:#3730a3;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.fig-rt{fill:none;stroke:#16a34a;stroke-width:1.3}.fig-dot{fill:#3730a3}.fig-dotg{fill:#16a34a}.fig-ln{stroke:#888;stroke-width:1;fill:none}.fig-lnb{stroke:#3730a3;stroke-width:1.3;fill:none}.fig-lng{stroke:#16a34a;stroke-width:1.3;fill:none}</style>'
  const open = '<svg width="260" height="220" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+style
  if (f.type === 'triangle_rect') {
    const u=f.unite||'cm'
    const baseVal = f.base==='?' ? (Number(f.hauteur)||4) : Number(f.base)
    const hautVal = f.hauteur==='?' ? (Number(f.base)||4) : Number(f.hauteur)
    const sc=Math.min((S-2*P)/baseVal,(S-2*P)/hautVal)*0.85
    const W=baseVal*sc,H=hautVal*sc,ox=P+10,oy=S-P,sq=10
    const baseLabel = f.base==='?' ? '?' : f.base+' '+u
    const hautLabel = f.hauteur==='?' ? '?' : f.hauteur+' '+u
    return '<div class="q-figure">'+open+
      '<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+W)+','+oy+' '+ox+','+(oy-H)+'"/>'+
      '<rect class="fig-rt" x="'+ox+'" y="'+(oy-sq)+'" width="'+sq+'" height="'+sq+'"/>'+
      '<text class="fig-lb" x="'+(ox+W/2)+'" y="'+(oy+16)+'" text-anchor="middle">'+baseLabel+'</text>'+
      '<text class="fig-lb" x="'+(ox-8)+'" y="'+(oy-H/2+4)+'" text-anchor="end">'+hautLabel+'</text>'+
      '</svg></div>'
  }
  if (f.type === 'triangle') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.base,(S-2*P)/f.hauteur)*0.85
    const W=f.base*sc,H=f.hauteur*sc,ox=(S-W)/2,oy=S-P,ax=ox+W*0.38,ay=oy-H
    return '<div class="q-figure">'+open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+W)+','+oy+' '+ax+','+ay+'"/><line class="fig-dm" x1="'+ax+'" y1="'+ay+'" x2="'+ax+'" y2="'+oy+'"/><text class="fig-lb" x="'+(S/2)+'" y="'+(oy+16)+'" text-anchor="middle">'+f.base+' '+u+'</text><text class="fig-lb" x="'+(ax+9)+'" y="'+((ay+oy)/2+4)+'" text-anchor="start">'+f.hauteur+' '+u+'</text></svg></div>'
  }
  if (f.type === 'rectangle') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.largeur,(S-2*P)/f.hauteur)*0.85
    const W=f.largeur*sc,H=f.hauteur*sc,ox=(S-W)/2,oy=(S-H)/2
    return '<div class="q-figure">'+open+'<rect class="fig-sh" x="'+ox+'" y="'+oy+'" width="'+W+'" height="'+H+'"/><text class="fig-lb" x="'+(ox+W/2)+'" y="'+(oy+H+17)+'" text-anchor="middle">'+f.largeur+' '+u+'</text><text class="fig-lb" x="'+(ox-8)+'" y="'+(oy+H/2+4)+'" text-anchor="end">'+f.hauteur+' '+u+'</text></svg></div>'
  }
  if (f.type === 'cercle') {
    const u=f.unite||'cm',R=(S-2*P)/2*0.82,cx=S/2,cy=S/2
    return '<div class="q-figure">'+open+'<circle class="fig-sh" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/><line class="fig-dm" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'"/><circle class="fig-dot" cx="'+cx+'" cy="'+cy+'" r="2.5"/><text class="fig-lb" x="'+(cx+R/2)+'" y="'+(cy-8)+'" text-anchor="middle">r = '+f.rayon+' '+u+'</text></svg></div>'
  }
  if (f.type === 'pythagore') {
    const u=f.unite||'cm'
    const aVal=(f.a&&f.a!=='?'&&f.a!==null)?Number(f.a):null
    const bVal=(f.b&&f.b!=='?'&&f.b!==null)?Number(f.b):null
    const refVal=aVal||bVal||4
    const sc2=Math.min((S-2*P)/(refVal+4),(S-2*P)/(refVal+4))*0.72
    const A=(aVal||refVal)*sc2,B=(bVal||refVal)*sc2,sq=10,ox=P+10,oy=S-P
    const aLabel=aVal?aVal+' '+u:'?'
    const bLabel=bVal?bVal+' '+u:'?'
    const hypLabel=(f.c&&f.c!=='?'&&f.c!==null)?f.c+' '+u:'?'
    return '<div class="q-figure">'+open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+B)+','+oy+' '+ox+','+(oy-A)+'"/><rect class="fig-rt" x="'+ox+'" y="'+(oy-sq)+'" width="'+sq+'" height="'+sq+'"/><text class="fig-lb" x="'+(ox+B/2)+'" y="'+(oy+16)+'" text-anchor="middle">'+bLabel+'</text><text class="fig-lb" x="'+(ox-8)+'" y="'+(oy-A/2+4)+'" text-anchor="end">'+aLabel+'</text><text class="fig-lb" x="'+(ox+B/2+14)+'" y="'+(oy-A/2-6)+'" text-anchor="start">'+hypLabel+'</text></svg></div>'
  }
  if (f.type === 'thales') {
    const ox=S/2, oy=P+10
    const abVal=f.ab==='?'?6:Number(f.ab)||6
    const amVal=f.am==='?'?3:Number(f.am)||3
    const ratio=Math.min(Math.max(amVal/abVal,0.2),0.8)
    const H=S-2*P, W=H*0.75
    const A={x:ox,y:oy}, B={x:ox-W/2,y:oy+H}, C={x:ox+W/2,y:oy+H}
    const D={x:ox-(W/2)*ratio,y:oy+H*ratio}, E={x:ox+(W/2)*ratio,y:oy+H*ratio}
    return '<div class="q-figure">'+open+
      '<polygon class="fig-sh" points="'+A.x+','+A.y+' '+B.x+','+B.y+' '+C.x+','+C.y+'"/>'+
      '<line class="fig-lnb" x1="'+D.x+'" y1="'+D.y+'" x2="'+E.x+'" y2="'+E.y+'"/>'+
      '<line class="fig-lng" x1="'+B.x+'" y1="'+B.y+'" x2="'+C.x+'" y2="'+C.y+'"/>'+
      '<circle class="fig-dot" cx="'+A.x+'" cy="'+A.y+'" r="3"/>'+
      '<circle class="fig-dot" cx="'+D.x+'" cy="'+D.y+'" r="3"/>'+
      '<circle class="fig-dot" cx="'+B.x+'" cy="'+B.y+'" r="3"/>'+
      '<circle class="fig-dotg" cx="'+E.x+'" cy="'+E.y+'" r="3"/>'+
      '<circle class="fig-dotg" cx="'+C.x+'" cy="'+C.y+'" r="3"/>'+
      '<text class="fig-lb" x="'+A.x+'" y="'+(A.y-7)+'" text-anchor="middle">A</text>'+
      '<text class="fig-lb" x="'+(B.x-7)+'" y="'+(B.y+4)+'" text-anchor="end">B</text>'+
      '<text class="fig-lb" x="'+(C.x+7)+'" y="'+(C.y+4)+'" text-anchor="start">C</text>'+
      '</svg></div>'
  }
  if (f.type === 'trapeze') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.grande_base,(S-2*P)/f.hauteur)*0.82
    const GB=f.grande_base*sc,PB=f.petite_base*sc,H=f.hauteur*sc,ox=(S-GB)/2,oy=S-P,off=(GB-PB)/2
    return '<div class="q-figure">'+open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+GB)+','+oy+' '+(ox+GB-off)+','+(oy-H)+' '+(ox+off)+','+(oy-H)+'"/><text class="fig-lb" x="'+(S/2)+'" y="'+(oy+16)+'" text-anchor="middle">'+f.grande_base+' '+u+'</text><text class="fig-lb" x="'+(S/2)+'" y="'+(oy-H-7)+'" text-anchor="middle">'+f.petite_base+' '+u+'</text></svg></div>'
  }
  if (f.type === 'parallelogramme') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.base,(S-2*P)/f.hauteur)*0.78
    const W=f.base*sc,H=f.hauteur*sc,sh=H*0.5,ox=P,oy=S-P
    return '<div class="q-figure">'+open+'<polygon class="fig-sh" points="'+(ox+sh)+','+(oy-H)+' '+(ox+sh+W)+','+(oy-H)+' '+(ox+W)+','+oy+' '+ox+','+oy+'"/><text class="fig-lb" x="'+(ox+sh/2+W/2)+'" y="'+(oy+16)+'" text-anchor="middle">'+f.base+' '+u+'</text></svg></div>'
  }
  return ''
}

// ═══════════════════════════════════════════════════
// DÉMARRAGE — appel serveur, plus jamais answer/explication ici
// ═══════════════════════════════════════════════════
async function demarrerExamen() {
  document.getElementById('main-area').innerHTML='<div class="loader">⏳ Préparation de ton examen…</div>'
  try {
    // access_token : sert à la fois à l'authentification (obligatoire,
    // 401 sinon — cf. api/examen.js, avec rafraîchissement+rejeu automatique
    // via appelExamenApi) et, pour la partie élève identifiée, au filtrage
    // des questions déjà vues (questions_vues, source='examen').
    const res = await appelExamenApi({ action: 'demarrer' })
    if (res.status === 401) { afficherEcranReconnexion(); return }
    const data = await res.json()
    if (!data.success) throw new Error(data.error || 'Erreur de chargement')
    if (data.vues) console.log('[questions_vues]', data.vues)

    questions = data.questions
    tentativeId = data.tentative_id
    answers={};saved=false;examEnCours=true;correction={};resultatServeur=null
    demarrerChrono(data.heure_fin ? new Date(data.heure_fin).getTime() : null)
    renderExamen()
  } catch(e){
    document.getElementById('main-area').innerHTML='<div class="loader">❌ '+e.message+'</div>'
  }
}

// heureFinExistant : passé lors d'une reprise (chrono continue depuis la
// heure_fin déjà fixée côté serveur) — sinon, calculé fraîchement ici.
function demarrerChrono(heureFinExistant){
  heureFin=heureFinExistant||(Date.now()+40*60*1000)
  document.getElementById('chrono').style.display='flex'
  document.getElementById('chrono').classList.remove('chrono-warning')
  var alerte10=false,alerte5=false,alerte1=false
  chronoInterval=setInterval(function(){
    const restant=Math.max(0,heureFin-Date.now())
    chronoSecondes=Math.floor((40*60*1000-restant)/1000)
    const m=Math.floor(restant/60000).toString().padStart(2,'0')
    const s=Math.floor((restant%60000)/1000).toString().padStart(2,'0')
    document.getElementById('chrono-text').textContent=m+':'+s
    var nbRepondues=Object.keys(answers).length
    var btn=document.getElementById('btn-terminer')
    if(btn){
      if(restant<=300000){btn.className='btn btn-red btn-full';btn.textContent='✅ Terminer l\'examen ('+nbRepondues+'/20 répondues) — '+m+':'+s+' restantes'}
      else{btn.textContent='✅ Terminer l\'examen ('+nbRepondues+'/20 répondues)'}
    }
    if(restant<=600000&&!alerte10){alerte10=true;document.getElementById('chrono').classList.add('chrono-warning');showToast('⏰ Plus que 10 minutes !','orange')}
    if(restant<=300000&&!alerte5){alerte5=true;showToast('⚠️ Plus que 5 minutes ! Vérifie tes réponses.','rouge');if(btn)btn.className='btn btn-red btn-full'}
    if(restant<=60000&&!alerte1){alerte1=true;showToast('🔴 Dernière minute ! L\'examen se termine bientôt.','rouge')}
    if(restant<=0){clearInterval(chronoInterval);examEnCours=false;showToast('⏰ Temps écoulé !','rouge');terminerExamen()}
  },500)
}

function arreterChrono(){clearInterval(chronoInterval)}

function renderExamen(){
  const nbRepondues=Object.keys(answers).length
  const pct=Math.round((nbRepondues/questions.length)*100)
  const letters=['A','B','C','D']
  let html=''
  if(!examEnCours){html+='<div class="alerte-ecoule">⏰ Temps écoulé ! L\'examen est terminé automatiquement.</div>'}
  html+='<div class="progress-label"><span>'+nbRepondues+'/20 questions répondues</span><span>'+pct+'%</span></div>'
  html+='<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%"></div></div>'
  questions.forEach(function(q,i){
    const sel=answers[i]
    html+='<div class="card">'
    html+='<div class="q-meta"><span class="q-num">Question '+(i+1)+'/20</span><span class="badge-partie">Partie '+q.partie+'</span><span class="badge-theme">'+(q.chapitre||q.theme)+'</span></div>'
    html+='<p class="q-text">'+q.q+'</p>'
    html+=renderTableau(q.tableau)
    html+=renderFigure(q.figure)
    q.opts.forEach(function(opt,j){
      const cls=j===sel?'option selected':'option'
      if(examEnCours){html+='<div class="'+cls+'" onclick="pick('+i+','+j+')"><span class="letter">'+letters[j]+'</span>'+opt+'</div>'}
      else{html+='<div class="'+cls+'" style="cursor:default"><span class="letter">'+letters[j]+'</span>'+opt+'</div>'}
    })
    html+='</div>'
  })
  if(examEnCours){
    const restant=heureFin?Math.max(0,heureFin-Date.now()):null
    const urgence=restant!==null&&restant<=300000
    const btnCls=urgence?'btn btn-red btn-full':'btn btn-green btn-full'
    const tempsLabel=urgence&&restant!==null?' — '+Math.floor(restant/60000)+':'+Math.floor((restant%60000)/1000).toString().padStart(2,'0')+' restantes':''
    html+='<div class="sticky-btn">'
    html+='<button id="btn-terminer" class="'+btnCls+'" onclick="confirmerTerminer()">✅ Terminer l\'examen ('+nbRepondues+'/20 répondues)'+tempsLabel+'</button>'
    if(nbRepondues<20)html+='<p style="text-align:center;font-size:12px;color:#999;margin-top:6px">Tu peux terminer même sans tout répondre</p>'
    html+='</div>'
  }
  document.getElementById('main-area').innerHTML=html
}

function pick(qi,oi){
  if(!examEnCours)return
  answers[qi]=oi
  const cards=document.querySelectorAll('.card')
  const card=cards[qi]
  if(card){card.querySelectorAll('.option').forEach(function(el,j){el.className=j===oi?'option selected':'option'})}
  var btn=document.getElementById('btn-terminer')
  var nbRepondues=Object.keys(answers).length
  if(btn){
    const restant=heureFin?Math.max(0,heureFin-Date.now()):null
    const urgence=restant!==null&&restant<=300000
    const m=restant?Math.floor(restant/60000).toString().padStart(2,'0'):'00'
    const s=restant?Math.floor((restant%60000)/1000).toString().padStart(2,'0'):'00'
    btn.textContent=urgence?'✅ Terminer l\'examen ('+nbRepondues+'/20 répondues) — '+m+':'+s+' restantes':'✅ Terminer l\'examen ('+nbRepondues+'/20 répondues)'
  }
  sauvegarderProgression()
  setTimeout(function(){const cards=document.querySelectorAll('.card');if(cards[qi+1])cards[qi+1].scrollIntoView({behavior:'smooth',block:'start'})},200)
}

// Fire-and-forget côté appelant (pick() ne l'attend pas, ne doit jamais
// ralentir la sélection d'une réponse) mais PAS silencieux : un échec qui
// persiste après le rafraîchissement de session (appelExamenApi) affiche un
// toast — une seule fois tant que ça échoue en boucle (progressionEnEchec),
// pas à chaque pick(). La reprise se dégrade au pire vers les dernières
// réponses effectivement sauvegardées, jamais un blocage de la saisie.
async function sauvegarderProgression(){
  if(!tentativeId||!accessToken)return
  try {
    const res = await appelExamenApi({ action: 'progression', tentative_id: tentativeId, reponses: construireReponses() })
    const data = await res.json().catch(function(){ return {} })
    if (!res.ok || !data.success) throw new Error(data.error || ('HTTP '+res.status))
    progressionEnEchec=false
  } catch(e) {
    console.log('[progression] échec sauvegarde:', e.message)
    if (!progressionEnEchec) {
      progressionEnEchec=true
      showToast('⚠️ Sauvegarde impossible — vérifie ta connexion, cette réponse n\'est pas encore enregistrée', 'rouge')
    }
  }
}

function confirmerTerminer(){
  const nbRepondues=Object.keys(answers).length
  if(nbRepondues<20){const ok=confirm('⚠️ Tu n\'as répondu qu\'à '+nbRepondues+'/20 questions.\nLes '+(20-nbRepondues)+' questions sans réponse comptent comme fausses.\nTu es sûr de vouloir terminer ?');if(!ok)return}
  terminerExamen()
}

async function terminerExamen(){
  arreterChrono();examEnCours=false
  document.getElementById('chrono').style.display='none'
  document.getElementById('main-area').innerHTML='<div class="loader">⏳ Correction en cours…</div>'
  await sauvegarder()
  renderResultats()
}

// ═══════════════════════════════════════════════════
// SAUVEGARDER — appelle le serveur pour la correction, plus de calcul local
// ═══════════════════════════════════════════════════
async function sauvegarder(){
  if(saved||!user)return
  if(!emailParent){const {data:profil}=await sb.from('profils').select('email_parent').eq('user_id',user.id).limit(1);if(profil&&profil.length>0)emailParent=profil[0].email_parent}

  const reponses = construireReponses()
  const tempsSecondes=heureFin?Math.floor((40*60*1000-Math.max(0,heureFin-Date.now()))/1000):chronoSecondes

  try {
    const res = await appelExamenApi({
      action: 'enregistrer', tentative_id: tentativeId,
      email: user.email, prenom,
      reponses, temps_secondes: tempsSecondes,
      client_key: crypto.randomUUID()
    })
    const data = await res.json()
    if (!data.success) { console.error('Erreur enregistrement:', data.error); return }

    correction = data.correction
    // temps_secondes du serveur (calculé à partir de heure_fin) prioritaire
    // sur la valeur locale : celle-ci n'est plus qu'un repli d'affichage si
    // jamais absente de la réponse.
    resultatServeur = { nbOk: data.score, themes: data.themes, questionsRatees: data.questionsRatees, tempsSecondes: data.temps_secondes!==undefined?data.temps_secondes:tempsSecondes }
    saved=true;console.log('✅ Examen enregistré')

    if(emailParent){try{await fetch('/api/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'brevet-blanc',emailParent:emailParent,prenom:prenom||'',nom:nom||'',score:data.score,total:20,pct:Math.round((data.score/20)*100),scoresThemes:data.themes,tempsSecondes:tempsSecondes})});console.log('✅ Email envoyé')}catch(emailErr){console.error('Erreur email:',emailErr.message)}}
  } catch(e){console.log('Erreur:',e.message)}
}

// ═══════════════════════════════════════════════════
// RÉSULTATS — utilise le score reçu du serveur, plus de recalcul local
// ═══════════════════════════════════════════════════
function renderResultats(){
  const nbOk = resultatServeur ? resultatServeur.nbOk : 0
  const themes = resultatServeur ? resultatServeur.themes : {}
  const tempsSecondes = resultatServeur ? resultatServeur.tempsSecondes : chronoSecondes
  const pct=Math.round((nbOk/20)*100)
  const mention=getMention(pct)

  let html='<div class="results-screen">'
  html+='<div class="results-score-big">'+nbOk+'/20</div>'
  html+='<div class="results-pct" style="color:'+(pct>=50?'#16a34a':'#dc2626')+'">'+pct+'%</div>'
  html+='<div class="results-mention">'+mention.label+'</div>'
  html+='<div class="results-temps">⏱️ '+formatTemps(tempsSecondes)+'</div>'
  html+='<div class="results-mention-officielle '+mention.cls+'">'+mention.officiel+'</div>'
  html+='<div class="themes-recap">'
  Object.keys(themes).forEach(function(theme){const s=themes[theme];const tpct=Math.round((s.ok/s.total)*100);html+='<div class="theme-score"><div class="theme-score-num" style="color:'+(tpct>=50?'#16a34a':'#dc2626')+'">'+s.ok+'/'+s.total+'</div><div class="theme-score-label">'+theme.split(' ')[0]+'</div></div>'})
  html+='</div>'
  html+= resultatServeur !== null
    ? '<div style="font-size:12px;color:#16a34a;margin-bottom:1.5rem">✅ Résultats enregistrés</div>'
    : '<div style="font-size:12px;color:#dc2626;margin-bottom:1.5rem">⚠️ Une erreur est survenue, tes résultats n\'ont peut-être pas été enregistrés — contacte ton professeur si le problème persiste</div>'
  html+='<div class="results-btns">'
  if (resultatServeur !== null) {
    // correction n'a de sens que si l'enregistrement a réussi : sans ça,
    // correction est vide ({}) et afficherait chaque question comme "Raté"
    // sans bonne réponse — trompeur plutôt qu'utile.
    html+='<button class="btn btn-primary btn-full" onclick="voirCorrection()">📋 Voir la correction complète</button>'
    html+='<button class="btn btn-green btn-full" onclick="demarrerExamen()">🔄 Recommencer un nouvel examen</button>'
  } else {
    // "Recommencer" écraserait la tentative en échec (nouveau tentative_id)
    // sans jamais avoir retenté D'ENREGISTRER celle-ci — on propose de
    // réessayer la même soumission avant d'abandonner l'idée.
    html+='<button class="btn btn-green btn-full" onclick="reessayerEnregistrement()">🔄 Réessayer l\'enregistrement</button>'
  }
  html+='<a href="quiz.html" class="btn btn-outline btn-full">← Retour à l\'accueil</a>'
  html+='</div></div>'
  document.getElementById('main-area').innerHTML=html
  window.scrollTo({top:0,behavior:'smooth'})
}

// saved reste déjà à false quand on arrive ici (sauvegarder() n'a jamais
// réussi) : son propre garde interne (if(saved||!user)return) n'a donc rien
// à réinitialiser, un simple nouvel appel suffit — reponses/heureFin sont
// toujours en mémoire côté client.
async function reessayerEnregistrement(){
  document.getElementById('main-area').innerHTML='<div class="loader">⏳ Nouvel essai…</div>'
  await sauvegarder()
  renderResultats()
}

// ═══════════════════════════════════════════════════
// CORRECTION — utilise le dictionnaire reçu du serveur, plus jamais q.answer
// ═══════════════════════════════════════════════════
function voirCorrection(){
  const letters=['A','B','C','D']
  let html='<div style="margin-bottom:1rem"><button class="btn btn-outline" onclick="renderResultats()">← Retour aux résultats</button></div>'
  questions.forEach(function(q,i){
    const sel=answers[i]
    const infoCorrection = correction[q.id] || {}
    const bonneReponse = infoCorrection.answer
    const explication = infoCorrection.explication || ''
    const correct=sel===bonneReponse
    const couleur=correct?'#16a34a':'#dc2626'
    const titre=correct?'✓ Bravo !':'✗ Pas tout à fait.'
    const bonneRep=!correct?'<br><strong style="color:#16a34a">La bonne réponse est : '+q.opts[bonneReponse]+'</strong>':''
    html+='<div class="card">'
    html+='<div class="q-meta"><span class="q-num">Question '+(i+1)+'/20</span>'
    html+='<span class="badge" style="'+(correct?'background:#f0fdf4;color:#16a34a':'background:#fef2f2;color:#dc2626')+'">'+(correct?'✅ Correct':'❌ Raté')+'</span>'
    html+='<span class="badge-theme">'+(q.chapitre||q.theme)+'</span></div>'
    html+='<p class="q-text">'+q.q+'</p>'
    html+=renderTableau(q.tableau)
    html+=renderFigure(q.figure)
    q.opts.forEach(function(opt,j){let cls='option';if(j===bonneReponse)cls+=' correct';else if(j===sel&&sel!==bonneReponse)cls+=' wrong';html+='<div class="'+cls+'" style="cursor:default"><span class="letter">'+letters[j]+'</span>'+opt+'</div>'})
    html+='<div class="explication"><strong style="color:'+couleur+'">'+titre+'</strong>'+bonneRep+'<br><br>'+explication+'</div>'
    html+='</div>'
  })
  html+='<a href="quiz.html" class="btn btn-outline btn-full" style="margin-bottom:2rem">← Retour à l\'accueil</a>'
  document.getElementById('main-area').innerHTML=html
  window.scrollTo({top:0,behavior:'smooth'})
}

async function logout(){
  if(examEnCours&&!saved){
    const ok=confirm('⚠️ Examen en cours. Tes résultats seront perdus. Continuer ?')
    if(!ok)return
    examEnCours=false
    await envoyerAbandonDefinitif()
  }
  await sb.auth.signOut()
  window.location.href='index.html'
}

init()
