<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Désabonnement — ACADEMIKA</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.card { background: white; border-radius: 16px; border: 1px solid #e8e8e4; padding: 2rem; max-width: 480px; width: 100%; text-align: center; }
.logo { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 2rem; }
.icon { font-size: 48px; margin-bottom: 1rem; }
.title { font-size: 20px; font-weight: 700; margin-bottom: 0.5rem; color: #1a1a1a; }
.subtitle { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 1.5rem; }
.note { font-size: 12px; color: #999; margin-top: 1.5rem; line-height: 1.6; }
.btn { background: #1a1a1a; color: white; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">∑ ACADEMIKA</div>
  <div id="content"></div>
</div>
<script>
const params  = new URLSearchParams(window.location.search)
const success = params.get('success')
const error   = params.get('error')
const email   = params.get('email')
const content = document.getElementById('content')

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function afficherSucces() {
  content.innerHTML =
    '<div class="icon">✅</div>' +
    '<div class="title">Désabonnement confirmé</div>' +
    '<div class="subtitle">Vous ne recevrez plus d\'emails automatiques d\'ACADEMIKA.</div>' +
    '<div class="note">Pour vous réabonner, contactez-nous :<br>' +
    '<a href="mailto:contact@academika.fr" style="color:#3730a3">contact@academika.fr</a></div>'
}

function afficherErreur() {
  content.innerHTML =
    '<div class="icon">❌</div>' +
    '<div class="title">Une erreur est survenue</div>' +
    '<div class="subtitle">Impossible de traiter votre demande.</div>' +
    '<div class="note">Contactez-nous directement :<br>' +
    '<a href="mailto:contact@academika.fr" style="color:#3730a3">contact@academika.fr</a></div>'
}

function afficherLienInvalide() {
  content.innerHTML =
    '<div class="icon">📧</div>' +
    '<div class="title">Lien invalide</div>' +
    '<div class="subtitle">Ce lien de désabonnement n\'est pas valide.</div>' +
    '<div class="note">Contactez-nous directement :<br>' +
    '<a href="mailto:contact@academika.fr" style="color:#3730a3">contact@academika.fr</a></div>'
}

async function confirmerDesabonnement() {
  const btn = document.getElementById('btn-confirmer')
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi en cours…' }
  try {
    const res = await fetch('/api/desabonner', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    const data = await res.json()
    if (res.ok && data.success) {
      afficherSucces()
    } else {
      afficherErreur()
    }
  } catch(e) {
    afficherErreur()
  }
}

if (success) {
  afficherSucces()
} else if (error) {
  afficherErreur()
} else if (email) {
  content.innerHTML =
    '<div class="icon">📧</div>' +
    '<div class="title">Confirmer le désabonnement</div>' +
    '<div class="subtitle">Souhaitez-vous vraiment ne plus recevoir les emails de suivi pour cette adresse ?</div>' +
    '<div class="note" style="margin-bottom:1.5rem"><strong>' + escHtml(email) + '</strong></div>' +
    '<button id="btn-confirmer" class="btn">Confirmer le désabonnement</button>'
  document.getElementById('btn-confirmer').addEventListener('click', confirmerDesabonnement)
} else {
  afficherLienInvalide()
}
</script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
