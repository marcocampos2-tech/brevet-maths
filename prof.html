<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
:root {
  --bg: #FAF9F6; --surface: #ffffff; --border: #E4E1D8; --text: #41454C; --muted: #6B6E73;
  --green: #2F9E5C; --blue: #1B2A4A; --amber: #D4A23C; --red: #9E2B25;

}
.wrap { max-width: 1440px; margin: 0 auto; padding: 1.25rem 1rem; }
nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.25rem; border-bottom: 2px solid var(--blue); margin-bottom: 1.5rem; }

.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
.btn-red:hover { background: var(--red); color: white; }
.btn-blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.btn-blue:hover { background: var(--blue); color: white; }
.btn-green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.btn-green:hover { background: var(--green); color: white; }
.btn-amber { background: var(--amber-bg); color: #8a6416; border-color: var(--amber); }
.btn-amber:hover { background: var(--amber); color: white; }
.btn:disabled { opacity: .5; cursor: default; pointer-events: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }

.stat-green .stat-icon { background: var(--green-bg); color: var(--green); }

.stat-amber .stat-icon { background: var(--amber); color: white; }

.tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.tab { padding: 7px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; color: var(--text); }
.tab:hover { background: var(--bg); }
.tab.active { background: var(--blue); color: white; border-color: var(--blue); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
.card-title { font-family: 'Newsreader', serif; font-size: 15px; font-weight: 600; margin-bottom: 1rem; color: var(--blue); }

.offre-badge.accompagne { background: var(--green-bg); color: var(--green); border-color: var(--green); }

.offre-ligne label { color: var(--text); }
.offre-case { cursor: pointer; }
.offre-case input { width: 16px; height: 16px; cursor: pointer; }
.offre-bloc input[type=date] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; max-width: 100%; }
.offre-bloc input:focus-visible, .offre-bloc button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.offre-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.offre-msg.ok { color: var(--green); }

.dash-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.dash-table th { padding: 8px 6px; font-size: 10px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); text-align: center; text-transform: uppercase; letter-spacing: .03em; }
.dash-table th:first-child { text-align: left; }
.dash-table th.global { color: var(--blue); font-weight: 700; }
.dash-table td { padding: 8px 6px; border-bottom: 1px solid #F3F1EA; text-align: center; vertical-align: middle; }
.dash-table td:first-child { text-align: left; }

.eleve-cell { display: flex; align-items: center; gap: 8px; }

.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-bg); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; flex-shrink: 0; }

.q-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }

/* Le # est un ::before : le contenu d'un pseudo-element n'entre pas dans la selection, donc un

.q-card-id::before { content: '#'; opacity: 0.5; }
.banque-notice { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }

.places-bar-wrap { background: var(--border); border-radius: 4px; height: 6px; margin-bottom: 4px; }
.places-bar-fill { height: 6px; border-radius: 4px; background: var(--green); transition: width 0.3s; }
.places-bar-fill.warn { background: var(--amber); }
.places-bar-fill.full { background: var(--red); }
/* Formulaire OTP intégré — ajouté 17/08/2026, accès direct sans passer par une autre page */

  .stats { grid-template-columns: repeat(2, 1fr); }

}

<script>
const SB_URL = 'https://vkkgadwqumqqwpaayjac.supabase.co'
const SB_KEY = 'sb_publishable_3nwxCHSPliLzSB6B7BZYhw__sp7ToXI'
const PROF   = 'marcocampos2@gmail.com'
const sb     = supabase.createClient(SB_URL, SB_KEY)

// Grille alignée sur le référentiel Eduscol (5 thèmes cycle 4) — migrée
// depuis les 4 anciens domaines le 19/08/2026. Structure identique à
// quiz.html pour garantir la cohérence (mêmes clés theme/sous_theme en base).
const THEMES = [
  'Nombres et calculs',
  'Organisation et gestion de données, fonctions',
  'Grandeurs et mesures',
  'Espace et géométrie',
  'Algorithmique et programmation'
]
const THEMES_SHORT = ['Nombres', 'Organisation', 'Grandeurs', 'Géométrie', 'Algo']

let ROWS = [], EXAMENS = [], PROFILS = {}, ELEVES = []
let userIdCourant = null
let INSCRIPTIONS = [], SESSIONS = []
let BANQUE_DATA = []
let banqueFiltre = { theme: '', sousTheme: '', diff: '', search: '', page: 0, resetParId: false }
const PER_PAGE = 20
let editCurrentId = null
let editCurrentTable = 'questions_banque'
let noteCurrentId = null
let adresseCurrentId = null

// ═══════════════════════════════════════════════════
// CONNEXION OTP INTÉGRÉE — ajouté 17/08/2026
// Même mécanisme que espace-parent.html (sb.auth.signInWithOtp /
// verifyOtp), mais shouldCreateUser: false — cette page ne doit jamais
// créer de nouveau compte, uniquement authentifier un compte prof existant.
// ═══════════════════════════════════════════════════
let profEmailCourant = ''

function renderLoginProf(messageInfo) {
  document.getElementById('btn-logout-nav').style.display = 'none'
  let html = ''
  html += '<div class="login-wrap"><div class="login-card">'
  html += '<div class="login-title">Connexion</div>'
  html += '<div class="login-desc">Entre ton adresse email. Tu recevras un code de connexion à 6 chiffres.</div>'
  html += '<div class="field"><label>Adresse email</label><input type="email" id="prof-login-email" placeholder="ton@email.fr" autocomplete="email"></div>'
  html += '<button class="btn btn-blue" onclick="envoyerCodeProf()" id="prof-btn-envoyer">Recevoir mon code</button>'
  html += '<div id="prof-login-msg">' + (messageInfo ? '<div class="login-msg info">'+messageInfo+'</div>' : '') + '</div>'
  html += '</div></div>'
  document.getElementById('root').innerHTML = html
}

function renderCodeStepProf() {
  let html = ''
  html += '<div class="login-wrap"><div class="login-card">'
  html += '<div class="login-title">Vérifie ta boîte mail</div>'
  html += '<div class="login-desc">Un code vient d\'être envoyé à <strong>'+profEmailCourant+'</strong>.</div>'
  html += '<div class="field"><label>Code reçu par email</label><input type="text" id="prof-login-code" class="login-code-input" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" oninput="this.value=this.value.replace(/\\D/g,\'\').slice(0,6)"></div>'
  html += '<button class="btn btn-blue" onclick="verifierCodeProf()" id="prof-btn-verifier">Valider le code</button>'
  html += '<button class="login-lien" onclick="renderLoginProf()">← Changer d\'adresse email</button>'
  html += '<div id="prof-login-msg"></div>'
  html += '</div></div>'
  document.getElementById('root').innerHTML = html
}

async function envoyerCodeProf() {
  const email = document.getElementById('prof-login-email').value.trim()
  const msg = document.getElementById('prof-login-msg')
  if (!email || !email.includes('@')) { msg.innerHTML = '<div class="login-msg erreur">Merci de saisir une adresse email valide.</div>'; return }
  const btn = document.getElementById('prof-btn-envoyer')
  btn.disabled = true; btn.textContent = 'Envoi…'
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } })
  if (error) {
    msg.innerHTML = '<div class="login-msg erreur">Impossible d\'envoyer le code. Vérifie l\'adresse ou réessaie.</div>'
    btn.disabled = false; btn.textContent = 'Recevoir mon code'
    return
  }
  profEmailCourant = email
  renderCodeStepProf()
}

async function verifierCodeProf() {
  const code = document.getElementById('prof-login-code').value.replace(/\D/g, '')
  const msg = document.getElementById('prof-login-msg')
  if (code.length !== 6) { msg.innerHTML = '<div class="login-msg erreur">Le code doit contenir 6 chiffres.</div>'; return }
  const btn = document.getElementById('prof-btn-verifier')
  btn.disabled = true; btn.textContent = 'Vérification…'
  const { error } = await sb.auth.verifyOtp({ email: profEmailCourant, token: code, type: 'email' })
  if (error) {
    msg.innerHTML = '<div class="login-msg erreur">Code invalide ou expiré.</div>'
    btn.disabled = false; btn.textContent = 'Valider le code'
    return
  }
  document.getElementById('root').innerHTML = '<div class="loader">Connexion…</div>'
  init()
}

// ═══════════════════════════════════════════════════
// ACTIVITÉ PAR ÉLÈVE — une seule définition, partagée par l'onglet Élèves et
// l'onglet Questions ratées.
//  - session terminée = ligne de resultats avec abandonne = false (NULL
//    compris) ; interrompue = abandonne = true. Critère UNIQUEMENT sur la
//    colonne abandonne, jamais sur le texte « abandonné ».
//  - durée = somme de temps_secondes des sessions terminées.
//  - dernier examen blanc = examen non abandonné le plus récent.
//  - dernière activité = created_at le plus récent, resultats et examens
//    confondus, abandons compris.
// ═══════════════════════════════════════════════════
let STATS_ELEVES = {}

function calculerStatsEleves() {
  const m = {}
  const get = id => m[id] || (m[id] = { terminees: 0, interrompues: 0, dureeSec: 0, dernierExamen: null, derniereActivite: null })
  const plusRecent = (a, b) => (!a || new Date(b) > new Date(a)) ? b : a
  ROWS.forEach(r => {
    const st = get(r.user_id)
    if (r.abandonne) st.interrompues++
    else { st.terminees++; st.dureeSec += r.temps_secondes || 0 }
    st.derniereActivite = plusRecent(st.derniereActivite, r.created_at)
  })
  EXAMENS.forEach(x => {
    const st = get(x.user_id)
    if (!x.abandonne && (!st.dernierExamen || new Date(x.created_at) > new Date(st.dernierExamen.created_at))) st.dernierExamen = x
    st.derniereActivite = plusRecent(st.derniereActivite, x.created_at)
  })
  return m
}

function statsEleve(userId) {
  return STATS_ELEVES[userId] || { terminees: 0, interrompues: 0, dureeSec: 0, dernierExamen: null, derniereActivite: null }
}

// Entrée de questions_ratees → { domaine, notion, aucune }. Format écrit par
// api/quiz-resultat.js : « <thème> — <chapitre ou 40 premiers caractères de
// l'énoncé> », précédé de « [Aucune idée] » pour une question sans réponse.
// La notion est prise telle quelle (aucun trim). Pas de détection des énoncés
// tronqués : elle n'est pas fiable (cf. PR 4, identifiants de questions).
const MARQUE_AUCUNE_IDEE = '[Aucune idée] '
function analyserRatee(brut) {
  let t = String(brut == null ? '' : brut)
  const aucune = t.startsWith(MARQUE_AUCUNE_IDEE)
  if (aucune) t = t.slice(MARQUE_AUCUNE_IDEE.length)
  const i = t.indexOf(' — ')
  return {
    domaine: i === -1 ? 'Sans domaine' : t.slice(0, i),
    notion: (i === -1 ? t : t.slice(i + 3)) || '(sans intitulé)',
    aucune
  }
}

// Énoncé normalisé (trim + espaces multiples réduits) : clé de regroupement des
// énoncés complets — plusieurs ids peuvent partager un même énoncé.
const normaliserEnonce = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ')

// Notions ratées des sessions de quiz TERMINÉES (examens blancs hors
// périmètre), agrégées par domaine + sous-thème + notion, puis triées par
// nombre d'échecs décroissant et ordre alphabétique. nb compte les échecs et les
// « aucune idée » ; aucune, la part « aucune idée » ; ids, les identifiants
// questions_banque rencontrés (vide pour une ancienne session).
//  - domaine / sous-thème : colonnes theme et sous_theme de la ligne resultats
//    (une session = un sous-thème), jamais la chaîne. Domaine : à défaut, préfixe
//    de la chaîne. sous-thème '' si NULL, vide ou blanc : « non renseigné ».
//  - notion : si la ligne a un questions_ratees_detail NON VIDE (banque, depuis le
//    18/10/2026), énoncé complet normalisé de chaque entrée ; sinon (ancienne
//    session, quiz IA : détail null ou []), chaîne tronquée de questions_ratees,
//    comme avant. Les deux versions d'une même question ne sont pas fusionnées
//    volontairement (sauf texte strictement identique après normalisation).
function agregerRatees(rows) {
  const m = {}
  const ajouter = (domaine, sousTheme, notion, aucune, id) => {
    const k = domaine + '\u0000' + sousTheme + '\u0000' + notion
    const e = m[k] || (m[k] = { domaine, sousTheme, notion, nb: 0, aucune: 0, ids: [] })
    e.nb++
    if (aucune) e.aucune++
    if (id != null && !e.ids.includes(id)) e.ids.push(id)
  }
  rows.forEach(r => {
    if (r.abandonne) return
    const sousTheme = String(r.sous_theme == null ? '' : r.sous_theme).trim()
    const colTheme = String(r.theme == null ? '' : r.theme).trim()
    const detail = Array.isArray(r.questions_ratees_detail) && r.questions_ratees_detail.length ? r.questions_ratees_detail : null
    if (detail) {
      detail.forEach(d => {
        const enonce = normaliserEnonce(d && d.enonce)
        ajouter(colTheme || 'Sans domaine', sousTheme, enonce || '(énoncé non enregistré)', !!(d && d.aucune_idee === true), Number.isInteger(d && d.id) ? d.id : null)
      })
      return
    }
    ;(Array.isArray(r.questions_ratees) ? r.questions_ratees : []).forEach(q => {
      const a = analyserRatee(q)
      ajouter(colTheme || a.domaine, sousTheme, a.notion, a.aucune, null)
    })
  })
  return Object.values(m).sort((x, y) => y.nb - x.nb || x.notion.localeCompare(y.notion, 'fr') || x.sousTheme.localeCompare(y.sousTheme, 'fr'))
}

// Appel unique vers /api/email pour tous les boutons du prof. Le jeton est relu
// au moment de l'envoi (sb.auth.getSession() rafraîchit un jeton expiré) :
// api/email.js exige un jeton valide dont le rôle serveur est 'prof'.
// Par défaut : renvoie true si l'envoi a réussi, sinon alerte courte et false
// (n'interrompt jamais le flux appelant). Avec { brut: true } : renvoie la
// Response, sans alerte, pour les appels qui lisent eux-mêmes data.success /
// data.error (envoyerAdresse, envoyerResultats, envoyerBilan) ; une erreur
// réseau y est propagée comme avant.
async function appelerEmail(payload, { brut = false } = {}) {
  let res
  try {
    const { data: { session } } = await sb.auth.getSession()
    const headers = { 'Content-Type': 'application/json' }
    if (session?.access_token) headers['Authorization'] = 'Bearer ' + session.access_token
    res = await fetch('/api/email', { method: 'POST', headers, body: JSON.stringify(payload) })
  } catch (e) {
    console.log('Erreur appel /api/email:', e.message)
    if (brut) throw e
    alert('Email non envoyé : recharge la page')
    return false
  }
  if (brut) return res
  if (!res.ok) { alert('Email non envoyé : recharge la page'); return false }
  return true
}

// Échappe une chaîne pour une insertion sûre à l'intérieur d'un attribut onclick="...('...')"
// (protège contre les apostrophes dans les prénoms/noms composés : D'Angelo, N'Diaye...)
// ⚠️ Échappement JS uniquement : ne protège PAS le HTML. Pour une valeur insérée
// dans le HTML, utiliser escHtml(). Pour un argument de onclick, escAttrJs().
function esc(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
}

// Échappement HTML : à appliquer à toute valeur issue de la base avant insertion dans
// innerHTML, une chaîne HTML concaténée ou un attribut (corps, value="…", src="…").
function escHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

// Identifiant (UUID) passé en argument d'un onclick="f('…')" : échappement JS puis HTML
// (le navigateur décode l'attribut avant d'évaluer le JS). Jamais de texte libre ici :
// les fonctions appelées retrouvent l'objet dans les données déjà chargées.
function escAttrJs(v) {
  return escHtml(esc(v))
}

// scoresExamen() — volontairement NON migré vers 5 thèmes (décision du

// La migrer maintenant casserait l'affichage du tableau "Examens en ligne"
// tant que examen_questions n'a pas suivi. À corriger EN MÊME TEMPS que le
// chantier 2 : passer de 4 clés avec repli || à 5 clés distinctes sans
// repli — le repli actuel (sc('grandeur')||sc('algo')) est un bug latent
// qui ne s'active que si les deux thèmes sont un jour séparés côté examen.
function scoresExamen(th) {
  const sc = key => {
    const k = Object.keys(th).find(k => k.toLowerCase().includes(key))
    return k ? th[k].ok+'/'+th[k].total : '—'
  }
  return { nombres: sc('nombre'), geo: sc('espace')||sc('geom'), stats: sc('organisation')||sc('stat'), grandeurs: sc('grandeur')||sc('algo') }
}

// ONGLET QUESTIONS RATÉES — « Tous les élèves » (20 premières notions) ou un
// élève (indicateurs d'activité + toutes ses notions), regroupées par domaine.
// ═══════════════════════════════════════════════════
function renderRatees(userId) {
  const sel = document.getElementById('ratees-eleve'), cible = document.getElementById('ratees-contenu')
  if (!sel || !cible) return
  if (userId !== undefined) sel.value = userId
  const id = sel.value
  let h = ''
  if (id) {
    const st = statsEleve(id), ex = st.dernierExamen
    const carte = (val, label) => '<div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center"><div style="font-family:\'Newsreader\',serif;font-size:22px;font-weight:700;color:var(--blue)">'+escHtml(val)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+escHtml(label)+'</div></div>'
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem">'
    h += carte(st.terminees, 'Sessions terminées') + carte(st.interrompues, 'Interrompues') + carte(fmtTemps(st.dureeSec), 'Durée')
    h += carte(ex ? ex.score + '/20' : 'Aucun', ex ? 'Dernier examen blanc · ' + dateStr(ex.created_at) : 'Dernier examen blanc')
    h += '</div>'
  }
  const toutes = agregerRatees(id ? ROWS.filter(r => r.user_id === id) : ROWS)
  const liste = id ? toutes : toutes.slice(0, 20)
  if (!liste.length) {
    h += '<p class="empty">Aucune question ratée enregistrée'+(id ? ' pour cet élève' : '')+'.</p>'
  } else {
    if (!id && toutes.length > liste.length) h += '<p class="empty" style="margin-bottom:6px">'+liste.length+' notions les plus ratées, sur '+toutes.length+'.</p>'
    const parDomaine = {}
    liste.forEach(n => {
      const d = parDomaine[n.domaine] || (parDomaine[n.domaine] = {})
      ;(d[n.sousTheme] ||= []).push(n)
    })
    const rang = d => { const i = THEMES.indexOf(d); return i < 0 ? 99 : i }
    const total = ns => ns.reduce((t, n) => t + n.nb, 0)   // total des notions AFFICHÉES du sous-thème
    const totalDomaine = d => Object.values(parDomaine[d]).reduce((t, ns) => t + total(ns), 0)
    // domaines par total d'échecs décroissant (notions affichées), puis ordre de THEMES, puis alphabétique
    Object.keys(parDomaine).sort((a, b) => totalDomaine(b) - totalDomaine(a) || rang(a) - rang(b) || a.localeCompare(b, 'fr')).forEach(d => {
      h += '<div style="font-size:13px;font-weight:700;color:var(--blue);margin:16px 0 4px">'+escHtml(d)+'</div>'
      // sous-thèmes par total d'échecs décroissant ; « non renseigné » ('') toujours en dernier
      Object.keys(parDomaine[d]).sort((a, b) => (a === '') - (b === '') || total(parDomaine[d][b]) - total(parDomaine[d][a]) || a.localeCompare(b, 'fr')).forEach(st => {
        const ns = parDomaine[d][st], t = total(ns)
        h += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:10px 0 0 10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)"><span>'+escHtml(st || 'Sous-thème non renseigné')+'</span><span style="white-space:nowrap">'+t+' échec'+(t > 1 ? 's' : '')+'</span></div>'
        ns.forEach(n => {
          const compte = n.nb + '×' + (n.aucune ? ' (dont ' + n.aucune + ' « aucune idée »)' : '')
          // ids (énoncé complet) : « #753 » en petit ; 3 au plus puis « +N » si plusieurs ids partagent l'énoncé
          const idsAff = n.ids.length ? '<span style="font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap">'+escHtml(n.ids.slice(0, 3).map(i => '#' + i).join(', ') + (n.ids.length > 3 ? ' +' + (n.ids.length - 3) : ''))+'</span>' : ''
          h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:7px 0 7px 22px;border-bottom:1px solid #f3f3ef;font-size:13px"><span style="flex:1;min-width:0;overflow-wrap:anywhere;color:#444">'+escHtml(n.notion)+idsAff+'</span><span style="flex:0 1 auto;max-width:9.5rem;color:#9E2B25;font-weight:600;text-align:right">'+escHtml(compte)+'</span></div>'
        })
      })
    })
  }
  cible.innerHTML = h
}

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'
  html += '<div class="field" style="margin-bottom:0"><label>Date</label><input type="date" id="session-date"></div>'
  html += '<div class="field" style="margin-bottom:0"><label>Heure</label><input type="text" id="session-heure" placeholder="15h00" value="15h00"></div>'

      })
    }
    html += '</div>'
  })

  // Historique : sessions passées (non annulées) OU annulées — lecture seule, repliable
  if (sessionsHistorique.length) {
    html += '<div class="card" style="margin-bottom:1rem">'
    html += '<div style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleHistoriqueSessions()">'
    html += '<div class="card-title" style="margin-bottom:0">📁 Historique (' + sessionsHistorique.length + ')</div>'
    html += '<span id="historique-chevron" style="font-size:12px;color:var(--muted)">'+(historiqueSessionsOuvert?'▲':'▼')+'</span>'
    html += '</div>'
    html += '<div id="historique-sessions-body" style="display:'+(historiqueSessionsOuvert?'block':'none')+';margin-top:12px">'
    sessionsHistorique
      .slice()
      .sort((a,b) => b.date_session.localeCompare(a.date_session))
      .forEach(s => {
        const inscrits = INSCRIPTIONS.filter(i => i.session_id === s.id)
        const dateAffichee = new Date(s.date_session + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
        const statutLabel = s.annulee ? '<span class="badge badge-insuf">Annulée</span>' : '<span class="badge badge-admis">Terminée</span>'
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F3F1EA;font-size:13px">'
        html += '<span>📅 '+dateAffichee+' · '+escHtml(s.heure)+' — '+inscrits.length+' inscrit'+(inscrits.length>1?'s':'')+'</span>'
        html += statutLabel
        html += '</div>'
      })
    html += '</div>'
    html += '</div>'
  }

  el.innerHTML = html
}

async function creerSession() {
  const date = document.getElementById('session-date').value
  const heure = document.getElementById('session-heure').value.trim() || '15h00'
  const msg = document.getElementById('session-creation-msg')
  if (!date) { msg.innerHTML = '<span style="color:#9E2B25">⚠ Sélectionne une date.</span>'; return }
  msg.innerHTML = '<span style="color:#888">Création…</span>'
  const { error } = await sb.from('sessions_examen_blanc').insert({ date_session: date, heure })
  if (error) { msg.innerHTML = '<span style="color:#9E2B25">Erreur : '+escHtml(error.message)+'</span>'; return }
  msg.innerHTML = '<span style="color:#2F9E5C">✅ Session créée !</span>'
  setTimeout(() => chargerInscriptions(), 800)
}

async function annulerSession(sessionId) {
  // Date et nombre d'inscrits relus dans les données chargées (plus d'argument texte).
  const session = SESSIONS.find(s => String(s.id) === String(sessionId))
  if (!session) { alert('Session introuvable — recharge la page.'); return }
  const dateAffichee = dateSessionAff(session)
  const nbInscrits = INSCRIPTIONS.filter(i => i.session_id === session.id).length
  if (nbInscrits > 0) {
    if (!confirm('Il y a '+nbInscrits+' inscrit'+(nbInscrits>1?'s':'')+' sur la session du '+dateAffichee+'. Annuler quand même ? Un email sera envoyé à chaque inscrit.')) return
  } else {
    if (!confirm('Annuler la session du '+dateAffichee+' ?')) return
  }

  const inscritsSession = INSCRIPTIONS.filter(i => i.session_id === sessionId)
  for (const i of inscritsSession) {
    try {
      await appelerEmail({ type: 'adresse-brevet', sousType: 'annulation', emailParent: i.email_parent, prenom: i.prenom, nom: i.nom, date: dateAffichee })
    } catch(e) { console.log('Erreur email annulation session:', e.message) }
  }

  const { error } = await sb.from('sessions_examen_blanc').update({ annulee: true }).eq('id', sessionId)
  if (error) { alert('Erreur : '+error.message); return }
  chargerInscriptions()
}

let SESSIONS_STAGES = [], INSCRIPTIONS_STAGES = []

const DOMAINES_PAR_PERIODE = {
  'Toussaint': 'Nombres et calculs',
  'Noël': 'Organisation et gestion de données',
  'Hiver': 'Espace et géométrie',
  'Printemps': 'Grandeurs, mesures et algorithmique',

}

function preRemplirDomaine() {

async function chargerStages() {
  const el = document.getElementById('stages-list')
  if (!el) return
  el.innerHTML = '<div class="loader">Chargement…</div>'

  const [rSessions, rInscriptions] = await Promise.all([
    sb.from('sessions_stages').select('*').order('date_debut', { ascending: true }),
    sb.from('inscriptions_stages').select('*').order('created_at', { ascending: true })
  ])
  if (rSessions.error) { el.innerHTML = '<div class="empty">Erreur : '+escHtml(rSessions.error.message)+'</div>'; return }
  if (rInscriptions.error) { el.innerHTML = '<div class="empty">Erreur : '+escHtml(rInscriptions.error.message)+'</div>'; return }

  SESSIONS_STAGES = rSessions.data || []
  INSCRIPTIONS_STAGES = rInscriptions.data || []

  const aujourdHui = new Date().toISOString().split('T')[0]

  let html = ''

  // Formulaire création
  html += '<div class="card" style="margin-bottom:1.5rem">'
  html += '<div class="card-title" style="margin-bottom:12px">➕ Créer un stage</div>'
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px">'
  html += '<div class="field" style="margin-bottom:0"><label>Période</label><select id="stage-periode" onchange="preRemplirDomaine()">'
  html += Object.keys(DOMAINES_PAR_PERIODE).map(p => '<option value="'+p+'">'+p+'</option>').join('')
  html += '</select></div>'
  html += '<div class="field" style="margin-bottom:0"><label>Domaine</label><input type="text" id="stage-domaine" value="Nombres et calculs"></div>'
  html += '</div>'
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px">'
  html += '<div class="field" style="margin-bottom:0"><label>Date début</label><input type="date" id="stage-date-debut"></div>'
  html += '<div class="field" style="margin-bottom:0"><label>Date fin</label><input type="date" id="stage-date-fin"></div>'
  html += '<div class="field" style="margin-bottom:0"><label>Heure</label><input type="text" id="stage-heure" placeholder="14h00" value="14h00"></div>'
  html += '</div>'
  html += '<button class="btn btn-green" onclick="creerSessionStage()">➕ Créer le stage</button>'
  html += '<div id="stage-creation-msg" style="margin-top:10px;font-size:13px"></div>'
  html += '</div>'

  if (!SESSIONS_STAGES.length) {
    el.innerHTML = html + '<div class="empty">Aucun stage créé pour le moment.</div>'
    return
  }

  const stagesActifs = SESSIONS_STAGES.filter(s => !s.annulee && s.date_debut >= aujourdHui)
  const stagesHistorique = SESSIONS_STAGES.filter(s => s.annulee || s.date_debut < aujourdHui)

  if (!stagesActifs.length) {
    html += '<div class="empty">Aucun stage actif pour le moment.</div>'
  }

  stagesActifs.forEach(s => {
    const inscrits = INSCRIPTIONS_STAGES.filter(i => i.session_id === s.id)
    const nb = inscrits.length
    const pctPlaces = Math.round(nb / s.max_places * 100)
    const fillClass = pctPlaces >= 100 ? 'full' : pctPlaces >= 60 ? 'warn' : ''
    const dateDebutAff = new Date(s.date_debut + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
    const dateFinAff = new Date(s.date_fin + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })

    html += '<div class="card" style="margin-bottom:1rem">'

    if (sessionEnEdition === s.id) {
      html += '<div class="card-title" style="margin-bottom:12px">✏️ Modifier le stage</div>'
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px">'
      html += '<div class="field" style="margin-bottom:0"><label>Période</label><select id="edit-stage-periode-'+escHtml(s.id)+'">'
      html += Object.keys(DOMAINES_PAR_PERIODE).map(p => '<option value="'+p+'"'+(p===s.periode?' selected':'')+'>'+p+'</option>').join('')
      html += '</select></div>'
      html += '<div class="field" style="margin-bottom:0"><label>Domaine</label><input type="text" id="edit-stage-domaine-'+escHtml(s.id)+'" value="'+escHtml(s.domaine)+'"></div>'
      html += '</div>'
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px">'
      html += '<div class="field" style="margin-bottom:0"><label>Date début</label><input type="date" id="edit-stage-date-debut-'+escHtml(s.id)+'" value="'+escHtml(s.date_debut)+'"></div>'
      html += '<div class="field" style="margin-bottom:0"><label>Date fin</label><input type="date" id="edit-stage-date-fin-'+escHtml(s.id)+'" value="'+escHtml(s.date_fin)+'"></div>'
      html += '<div class="field" style="margin-bottom:0"><label>Heure</label><input type="text" id="edit-stage-heure-'+escHtml(s.id)+'" value="'+escHtml(s.heure)+'"></div>'
      html += '</div>'
      html += '<button class="btn btn-green" onclick="enregistrerModificationStage(\''+escAttrJs(s.id)+'\')">Enregistrer</button> '
      html += '<button class="btn" onclick="annulerEditionStage()">Annuler</button>'
      html += '<div id="stage-edition-msg-'+escHtml(s.id)+'" style="margin-top:10px;font-size:13px"></div>'
    } else {
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
      html += '<div>'
      html += '<div style="font-size:14px;font-weight:700;color:var(--blue)">🎒 '+escHtml(s.periode)+' — '+escHtml(s.domaine)+'</div>'
      html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">Du '+dateDebutAff+' au '+dateFinAff+' · '+escHtml(s.heure)+'</div>'
      html += '<div class="places-bar-wrap" style="margin-top:8px;width:180px"><div class="places-bar-fill '+fillClass+'" style="width:'+Math.min(pctPlaces,100)+'%"></div></div>'
      html += '<div style="font-size:12px;color:var(--muted);margin-top:4px">'+nb+' / '+escHtml(s.max_places)+' places — '+(s.max_places-nb)+' disponibles</div>'
      html += '</div>'
      html += nb === 0 ? '<button class="btn btn-sm" onclick="modifierSessionStage(\''+escAttrJs(s.id)+'\')" style="margin-right:6px">✏️ Modifier</button>' : ''
      html += '<button class="btn btn-sm btn-red" onclick="annulerSessionStage(\''+escAttrJs(s.id)+'\')">🗑 Annuler le stage</button>'
      html += '</div>'

      if (!inscrits.length) {
        html += '<div class="empty">Aucun inscrit sur ce stage.</div>'
      } else {
        inscrits.forEach(i => {
          const isConfirme = i.confirme
          const cardClass = isConfirme ? 'confirme' : 'attente'
          const dateInscription = dateStr(i.created_at)

          html += '<div class="inscrit-card '+cardClass+'">'
          html += '<div class="inscrit-header">'
          html += '<div>'
          html += '<div class="inscrit-name">'+escHtml(i.prenom)+' '+escHtml(i.nom)+'</div>'
          html += '<div class="inscrit-info">📧 '+escHtml(i.email_parent)+(i.telephone?' · 📞 '+escHtml(i.telephone):'')+'</div>'
          html += '<div class="inscrit-info">Inscrit le '+dateInscription+'</div>'
          html += '</div>'
          html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'
          if (isConfirme) html += '<span class="badge badge-tb">✅ Confirmé</span>'
          else html += '<span class="badge badge-ab">⏳ En attente</span>'
          html += '</div>'
          html += '</div>'

          html += '<div class="inscrit-actions">'
          if (!isConfirme) {
            html += '<button class="btn btn-sm btn-green" onclick="confirmerInscriptionStage(\''+escAttrJs(i.id)+'\')">✅ Confirmer</button>'
            html += '<button class="btn btn-sm btn-red" onclick="refuserInscriptionStage(\''+escAttrJs(i.id)+'\')">❌ Refuser</button>'
          } else {
            html += '<button class="btn btn-sm btn-red" onclick="annulerInscriptionStage(\''+escAttrJs(i.id)+'\')">❌ Annuler l\'inscription</button>'
          }
          html += '</div>'
          html += '</div>'
        })
      }
    }
    html += '</div>'
  })

  if (stagesHistorique.length) {
    html += '<div class="card" style="margin-bottom:1rem">'
    html += '<div style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleHistoriqueStages()">'
    html += '<div class="card-title" style="margin-bottom:0">📁 Historique (' + stagesHistorique.length + ')</div>'
    html += '<span id="historique-stages-chevron" style="font-size:12px;color:var(--muted)">'+(historiqueStagesOuvert?'▲':'▼')+'</span>'
    html += '</div>'
    html += '<div id="historique-stages-body" style="display:'+(historiqueStagesOuvert?'block':'none')+';margin-top:12px">'
    stagesHistorique
      .slice()
      .sort((a,b) => b.date_debut.localeCompare(a.date_debut))
      .forEach(s => {
        const inscrits = INSCRIPTIONS_STAGES.filter(i => i.session_id === s.id)
        const dateDebutAff = new Date(s.date_debut + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })
        const statutLabel = s.annulee ? '<span class="badge badge-insuf">Annulé</span>' : '<span class="badge badge-admis">Terminé</span>'
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F3F1EA;font-size:13px">'
        html += '<span>🎒 '+escHtml(s.periode)+' — '+escHtml(s.domaine)+' · '+dateDebutAff+' — '+inscrits.length+' inscrit'+(inscrits.length>1?'s':'')+'</span>'
        html += statutLabel
        html += '</div>'
      })
    html += '</div>'
    html += '</div>'
  }

  el.innerHTML = html
}

  msg.innerHTML = '<span style="color:#888">Vérification…</span>'
  const { data: inscritsActuels, error: errCheck } = await sb.from('inscriptions_stages').select('id').eq('session_id', sessionId)
  if (errCheck) { msg.innerHTML = '<span style="color:#9E2B25">Erreur : '+escHtml(errCheck.message)+'</span>'; if(btn) btn.disabled = false; return }
  if (inscritsActuels && inscritsActuels.length > 0) {
    msg.innerHTML = '<span style="color:#9E2B25">⚠ Ce stage a désormais '+inscritsActuels.length+' inscrit'+(inscritsActuels.length>1?'s':'')+', modification impossible.</span>'

async function annulerSessionStage(sessionId) {

  const sessionStage = SESSIONS_STAGES.find(s => String(s.id) === String(sessionId))

async function confirmerEtEnvoyerAdresse(id) {
  // Inscription et session relues dans les données chargées (plus d'argument texte).
  const inscrit = INSCRIPTIONS.find(i => String(i.id) === String(id))
  const session = SESSIONS.find(s => s.id === inscrit?.session_id)
  if (!inscrit || !session) { alert('Inscription introuvable — recharge la page.'); return }
  const { prenom, nom, email_parent: emailParent } = inscrit
  const date = dateSessionAff(session)
  const heure = session.heure
  const adresse = document.getElementById('adresse-lieu')?.value?.trim()
  if (!adresse) { alert('⚠️ Saisis l\'adresse du lieu avant de confirmer.'); return }

// Figure du théorème de Pythagore : fond quadrillé, triangle aux proportions proches du réel
// (rapport des côtés borné entre 1/2 et 2), côté inconnu déduit de l'hypoténuse pour le dessin.
// Champ facultatif f.sommets = [angle droit, bas-droite, haut] (ex. ["A","B","C"]) : absent, aucune lettre.
// Même logique dans quiz.html (figurePythagoreSVG) et prof.html : à garder identiques.
function figurePythagoreSVG(f,pxW,pxH){
  var esc=function(s){return String(s).replace(/[&<>"']/g,'')}
  var u=esc(f.unite||'cm')
  var num=function(v){if(v===undefined||v===null||v===''||v==='?')return null;var n=Number(String(v).replace(',','.'));return isNaN(n)||n<=0?null:n}
  var a=num(f.a),b=num(f.b),c=num(f.c)
  if(a===null&&b!==null&&c!==null&&c>b)a=Math.sqrt(c*c-b*b)
  if(b===null&&a!==null&&c!==null&&c>a)b=Math.sqrt(c*c-a*a)
  if(a===null&&b===null){a=3;b=4}else if(a===null){a=b}else if(b===null){b=a}
  var ratio=Math.min(2,Math.max(0.5,b/a))
  var maxW=146,maxH=120,H=maxH,W=ratio*maxH
  if(W>maxW){W=maxW;H=maxW/ratio}
  var ox=70+(maxW-W)/2,top=36+(maxH-H)/2,oy=top+H,bx=ox+W
  var len=Math.sqrt(W*W+H*H),mx=(ox+bx)/2,my=(oy+top)/2,nx=H/len,ny=-W/len
  var r=function(n){return Math.round(n*10)/10}
  var lab=function(v,x,y,anchor){
    var inconnu=(num(v)===null)
    var t=inconnu?'?':esc(v)+' '+u
    return '<text x="'+r(x)+'" y="'+r(y)+'" text-anchor="'+anchor+'" font-size="'+(inconnu?18:16)+'" font-weight="'+(inconnu?700:600)+'" fill="'+(inconnu?'#B45309':'#14304F')+'" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter,sans-serif">'+t+'</text>'
  }
  var s=Array.isArray(f.sommets)&&f.sommets.length===3?f.sommets.map(esc):null
  var let_=function(t,x,y){return '<text x="'+r(x)+'" y="'+r(y)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#14304F" font-family="Inter,sans-serif">'+t+'</text>'}
  var alt='Triangle rectangle : côtés de l’angle droit '+esc(f.a)+' et '+esc(f.b)+', hypoténuse '+esc(f.c)+' ('+u+')'
  return '<svg width="'+pxW+'" height="'+pxH+'" viewBox="0 0 250 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+alt+'">'
    +'<defs><pattern id="fg-pyth" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#E3EAF5" stroke-width="1"/></pattern></defs>'
    +'<rect width="250" height="210" rx="10" fill="#fff"/><rect width="250" height="210" rx="10" fill="url(#fg-pyth)"/>'
    +'<polygon points="'+r(ox)+','+r(oy)+' '+r(bx)+','+r(oy)+' '+r(ox)+','+r(top)+'" fill="rgba(37,99,168,0.10)" stroke="#14304F" stroke-width="2.5" stroke-linejoin="round"/>'
    +'<polygon points="'+r(ox)+','+r(oy-13)+' '+r(ox+13)+','+r(oy-13)+' '+r(ox+13)+','+r(oy)+' '+r(ox)+','+r(oy)+'" fill="none" stroke="#14304F" stroke-width="1.5"/>'
    +(s?let_(s[0],ox-14,oy+16)+let_(s[1],bx+14,oy+16)+let_(s[2],ox-14,top-6):'')
    +lab(f.a,ox-9,(oy+top)/2+5.5,'end')
    +lab(f.b,mx,oy+26,'middle')
    +lab(f.c,mx+nx*30,my+ny*30+5.5,'middle')
    +'</svg>'
}

// Figure de trigonométrie (même langage visuel que figurePythagoreSVG). Même logique dans quiz.html et prof.html : à garder identiques.
// Aucun côté n'est étiqueté « opposé/adjacent » : c'est ce que l'élève doit trouver.
// Clé angle ABSENTE : aucun arc ; angle_masque:true : arc dessiné sans valeur (la forme suit quand même angle). Clé a, b ou c ABSENTE : aucune étiquette sur ce côté (questions de vocabulaire) ; "?" : inconnue en orange.
// Clés : a (côté vertical), b (côté horizontal), c (hypoténuse), unite, sommets (facultatif, [angle droit, bas-droite, haut]),
//        angle_sommet : "bas" (angle en bas à droite) ou "haut", angle : nombre ou "?"
function figureTrigoSVG(f,pxW,pxH){
  var esc=function(s){return String(s).replace(/[&<>"']/g,'')}
  var u=esc(f.unite||'cm')
  var num=function(v){if(v===undefined||v===null||v===''||v==='?')return null;var n=Number(String(v).replace(',','.'));return isNaN(n)||n<=0?null:n}
  var a=num(f.a),b=num(f.b),c=num(f.c),ang=num(f.angle)
  var bas=f.angle_sommet!=='haut'
  var ratio // b/a
  if(ang!==null&&ang<90){var t=Math.tan(ang*Math.PI/180);ratio=bas?1/t:t}
  else{
    if(a===null&&b!==null&&c!==null&&c>b)a=Math.sqrt(c*c-b*b)
    if(b===null&&a!==null&&c!==null&&c>a)b=Math.sqrt(c*c-a*a)
    if(a===null&&b===null){a=3;b=4}else if(a===null){a=b}else if(b===null){b=a}
    ratio=b/a
  }
  ratio=Math.min(2,Math.max(0.5,ratio))
  var maxW=146,maxH=120,H=maxH,W=ratio*maxH
  if(W>maxW){W=maxW;H=maxW/ratio}
  var ox=70+(maxW-W)/2,top=36+(maxH-H)/2,oy=top+H,bx=ox+W
  var len=Math.sqrt(W*W+H*H),mx=(ox+bx)/2,my=(oy+top)/2,nx=H/len,ny=-W/len
  var r=function(n){return Math.round(n*10)/10}
  var halo='stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter,sans-serif"'
  var lab=function(v,x,y,anchor){
    var inconnu=(num(v)===null)
    var t=inconnu?'?':esc(v)+' '+u
    return '<text x="'+r(x)+'" y="'+r(y)+'" text-anchor="'+anchor+'" font-size="'+(inconnu?18:16)+'" font-weight="'+(inconnu?700:600)+'" fill="'+(inconnu?'#B45309':'#14304F')+'" '+halo+'>'+t+'</text>'
  }
  var s=Array.isArray(f.sommets)&&f.sommets.length===3?f.sommets.map(esc):null
  var let_=function(t,x,y){return '<text x="'+r(x)+'" y="'+r(y)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#14304F" font-family="Inter,sans-serif">'+t+'</text>'}
  // arc d'angle
  var R=30,arc,lx,ly,anchor
  if(bas){
    var th=Math.atan2(H,W) // angle au sommet bas-droite
    var p1=[bx-R,oy],p2=[bx-R*Math.cos(th),oy-R*Math.sin(th)]
    arc='M'+r(p1[0])+' '+r(p1[1])+' A'+R+' '+R+' 0 0 1 '+r(p2[0])+' '+r(p2[1])
    var bis=[-(1+Math.cos(th)),-Math.sin(th)],bl=Math.hypot(bis[0],bis[1])
    lx=bx+bis[0]/bl*(R+(num(f.angle)===null?31:24));ly=oy+bis[1]/bl*(R+(num(f.angle)===null?31:24))+6;anchor='middle'
    if(th>0.87){lx=bx+24;ly=oy-14} // triangle étroit : étiquette à l'extérieur, à droite du sommet
  }else{
    var ph=Math.atan2(W,H) // angle au sommet haut
    var q1=[ox,top+R],q2=[ox+R*Math.sin(ph),top+R*Math.cos(ph)]
    arc='M'+r(q1[0])+' '+r(q1[1])+' A'+R+' '+R+' 0 0 0 '+r(q2[0])+' '+r(q2[1])
    var bis2=[Math.sin(ph)*1+0,1+Math.cos(ph)],b2=Math.hypot(bis2[0],bis2[1])
    lx=ox+bis2[0]/b2*(R+(num(f.angle)===null?31:24));ly=top+bis2[1]/b2*(R+(num(f.angle)===null?31:24))+6;anchor='middle'
    if(ph<0.55){lx=ox+34;ly=top+14} // angle aigu : étiquette à l'extérieur, à droite de l'hypoténuse
  }
  var inc=(num(f.angle)===null)
  var angTxt=inc?'?':esc(f.angle)+'°'
  var alt='Triangle rectangle, angle marqué '+(num(f.angle)===null?'inconnu':esc(f.angle)+'°')+(f.a!==undefined||f.b!==undefined||f.c!==undefined?' ; côtés '+esc(f.a)+', '+esc(f.b)+', hypoténuse '+esc(f.c)+' ('+u+')':'')
  return '<svg width="'+pxW+'" height="'+pxH+'" viewBox="0 0 250 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+alt+'">'
    +'<defs><pattern id="fg-trig" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#E3EAF5" stroke-width="1"/></pattern></defs>'
    +'<rect width="250" height="210" rx="10" fill="#fff"/><rect width="250" height="210" rx="10" fill="url(#fg-trig)"/>'
    +'<polygon points="'+r(ox)+','+r(oy)+' '+r(bx)+','+r(oy)+' '+r(ox)+','+r(top)+'" fill="rgba(37,99,168,0.10)" stroke="#14304F" stroke-width="2.5" stroke-linejoin="round"/>'
    +'<polygon points="'+r(ox)+','+r(oy-13)+' '+r(ox+13)+','+r(oy-13)+' '+r(ox+13)+','+r(oy)+' '+r(ox)+','+r(oy)+'" fill="none" stroke="#14304F" stroke-width="1.5"/>'
    +(f.angle!==undefined?'<path d="'+arc+'" fill="none" stroke="'+(inc?'#B45309':'#2563A8')+'" stroke-width="2.5"/>'
    +(f.angle_masque?'':'<text x="'+r(lx)+'" y="'+r(ly)+'" text-anchor="'+anchor+'" font-size="'+(inc?18:15)+'" font-weight="700" fill="'+(inc?'#B45309':'#2563A8')+'" '+halo+'>'+angTxt+'</text>'):'')
    +(s?let_(s[0],ox-14,oy+16)+let_(s[1],bx+14,oy+16)+let_(s[2],ox-14,top-6):'')
    +(f.a!==undefined?lab(f.a,ox-9,(oy+top)/2+5.5,'end'):'')
    +(f.b!==undefined?lab(f.b,mx,oy+26,'middle'):'')
    +(f.c!==undefined?lab(f.c,mx+nx*30,my+ny*30+5.5,'middle'):'')
    +'</svg>'
}


function renderFigureSVG(fig) {
  if (!fig || !fig.type) return ''
  var f = fig
  if (typeof f === 'string') { try { f = JSON.parse(f) } catch(e) { return '' } }
  if (!f || !f.type) return ''
  if (f.type === 'triangle_rect' && f.base === '?' && f.hauteur === '?') return ''
  const S = 180, P = 28
  const style = '<style>.fig-sh{fill:#eef2ff;stroke:#3730a3;stroke-width:1.5;stroke-linejoin:round}.fig-dm{fill:none;stroke:#3730a3;stroke-width:0.8;stroke-dasharray:3,2}.fig-lb{font-size:10px;fill:#3730a3;font-weight:600;font-family:sans-serif}.fig-rt{fill:none;stroke:#16a34a;stroke-width:1.3}.fig-dot{fill:#3730a3}.fig-dotg{fill:#16a34a}.fig-ln{stroke:#888;stroke-width:1;fill:none}.fig-lnb{stroke:#3730a3;stroke-width:1.3;fill:none}.fig-lng{stroke:#16a34a;stroke-width:1.3;fill:none}</style>'
  const open = '<svg width="180" height="180" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+style
  if (f.type === 'triangle_rect') {
    const u=f.unite||'cm'
    const baseVal=f.base==='?'?(Number(f.hauteur)||4):Number(f.base)
    const hautVal=f.hauteur==='?'?(Number(f.base)||4):Number(f.hauteur)
    const sc=Math.min((S-2*P)/baseVal,(S-2*P)/hautVal)*0.85
    const W=baseVal*sc,H=hautVal*sc,ox=P+8,oy=S-P,sq=9
    const bL=f.base==='?'?'?':f.base+' '+u
    const hL=f.hauteur==='?'?'?':f.hauteur+' '+u
    return open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+W)+','+oy+' '+ox+','+(oy-H)+'"/><rect class="fig-rt" x="'+ox+'" y="'+(oy-sq)+'" width="'+sq+'" height="'+sq+'"/><text class="fig-lb" x="'+(ox+W/2)+'" y="'+(oy+14)+'" text-anchor="middle">'+bL+'</text><text class="fig-lb" x="'+(ox-7)+'" y="'+(oy-H/2+4)+'" text-anchor="end">'+hL+'</text></svg>'
  }
  if (f.type === 'rectangle') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.largeur,(S-2*P)/f.hauteur)*0.85
    const W=f.largeur*sc,H=f.hauteur*sc,ox=(S-W)/2,oy=(S-H)/2
    return open+'<rect class="fig-sh" x="'+ox+'" y="'+oy+'" width="'+W+'" height="'+H+'"/><text class="fig-lb" x="'+(ox+W/2)+'" y="'+(oy+H+14)+'" text-anchor="middle">'+f.largeur+' '+u+'</text><text class="fig-lb" x="'+(ox-7)+'" y="'+(oy+H/2+4)+'" text-anchor="end">'+f.hauteur+' '+u+'</text></svg>'
  }
  if (f.type === 'cercle') {
    const u=f.unite||'cm',R=(S-2*P)/2*0.82,cx=S/2,cy=S/2
    return open+'<circle class="fig-sh" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/><line class="fig-dm" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'"/><circle class="fig-dot" cx="'+cx+'" cy="'+cy+'" r="2.5"/><text class="fig-lb" x="'+(cx+R/2)+'" y="'+(cy-7)+'" text-anchor="middle">r='+f.rayon+' '+u+'</text></svg>'
  }
  if (f.type === 'pythagore') return figurePythagoreSVG(f, 200, 168)
  if (f.type === 'trigonometrie') return figureTrigoSVG(f, 200, 168)
  if (f.type === 'thales') {
    // Aligné sur renderFigure() de quiz.html le 26/08/2026 — même sémantique de clés
    // (ab = AB, am = AM, rapport = am/ab) et même clé facultative configuration.
    // Absente ou non reconnue : rendu emboîté, identique au comportement précédent.
    const ox=S/2
    const abVal=f.ab==='?'?6:Number(f.ab)||6
    const amVal=f.am==='?'?3:Number(f.am)||3
    const papillon=String(f.configuration||'emboitee').toLowerCase()==='papillon'
    let A,B,C,M,N
    if (papillon) {
      // Le rapport peut dépasser 1 en papillon (AMN n'est pas forcément le plus petit
      // triangle) : bornes réciproques, et cadrage recalculé pour que les deux triangles
      // réunis remplissent la zone.
      const ratio=Math.min(Math.max(amVal/abVal,0.45),2.2)
      const demiLargeur=0.375
      const zone=S-2*P
      const sc=Math.min(zone/(1+ratio),zone/(2*demiLargeur*Math.max(1,ratio)))
      const hB=sc,hM=sc*ratio,wB=sc*demiLargeur,wM=wB*ratio
      const oy=P+hM
      A={x:ox,y:oy}
      B={x:ox-wB,y:oy+hB}
      C={x:ox+wB,y:oy+hB}
      M={x:ox+wM,y:oy-hM}
      N={x:ox-wM,y:oy-hM}
    } else {
      const oy=P+8
      const ratio=Math.min(Math.max(amVal/abVal,0.2),0.8)
      const H=S-2*P,W=H*0.75
      A={x:ox,y:oy}
      B={x:ox-W/2,y:oy+H}
      C={x:ox+W/2,y:oy+H}
      M={x:ox-(W/2)*ratio,y:oy+H*ratio}
      N={x:ox+(W/2)*ratio,y:oy+H*ratio}
    }
    const aX=papillon?A.x+8:A.x
    const aY=papillon?A.y+4:A.y-7
    const aAnchor=papillon?'start':'middle'
    const mX=papillon?M.x+7:M.x-7
    const mAnchor=papillon?'start':'end'
    const nX=papillon?N.x-7:N.x+7
    const nAnchor=papillon?'end':'start'
    const polyAMN=papillon?'<polygon class="fig-sh" points="'+A.x+','+A.y+' '+M.x+','+M.y+' '+N.x+','+N.y+'"/>':''
    const dotN=papillon?'fig-dot':'fig-dotg'
    const dotB=papillon?'fig-dotg':'fig-dot'
    return open+
      '<polygon class="fig-sh" points="'+A.x+','+A.y+' '+B.x+','+B.y+' '+C.x+','+C.y+'"/>'+
      polyAMN+
      '<line class="fig-lnb" x1="'+M.x+'" y1="'+M.y+'" x2="'+N.x+'" y2="'+N.y+'"/>'+
      '<line class="fig-lng" x1="'+B.x+'" y1="'+B.y+'" x2="'+C.x+'" y2="'+C.y+'"/>'+
      '<circle class="fig-dot" cx="'+A.x+'" cy="'+A.y+'" r="2.5"/>'+
      '<circle class="fig-dot" cx="'+M.x+'" cy="'+M.y+'" r="2.5"/>'+
      '<circle class="'+dotN+'" cx="'+N.x+'" cy="'+N.y+'" r="2.5"/>'+
      '<circle class="'+dotB+'" cx="'+B.x+'" cy="'+B.y+'" r="2.5"/>'+
      '<circle class="fig-dotg" cx="'+C.x+'" cy="'+C.y+'" r="2.5"/>'+
      '<text class="fig-lb" x="'+aX+'" y="'+aY+'" text-anchor="'+aAnchor+'">A</text>'+
      '<text class="fig-lb" x="'+mX+'" y="'+(M.y+4)+'" text-anchor="'+mAnchor+'">M</text>'+
      '<text class="fig-lb" x="'+nX+'" y="'+(N.y+4)+'" text-anchor="'+nAnchor+'">N</text>'+
      '<text class="fig-lb" x="'+(B.x-7)+'" y="'+(B.y+4)+'" text-anchor="end">B</text>'+
      '<text class="fig-lb" x="'+(C.x+7)+'" y="'+(C.y+4)+'" text-anchor="start">C</text>'+
      '</svg>'
  }
  if (f.type === 'triangle') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.base,(S-2*P)/f.hauteur)*0.85
    const W=f.base*sc,H=f.hauteur*sc,ox=(S-W)/2,oy=S-P,ax=ox+W*0.38,ay=oy-H
    return open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+W)+','+oy+' '+ax+','+ay+'"/><line class="fig-dm" x1="'+ax+'" y1="'+ay+'" x2="'+ax+'" y2="'+oy+'"/><text class="fig-lb" x="'+(S/2)+'" y="'+(oy+14)+'" text-anchor="middle">'+f.base+' '+u+'</text><text class="fig-lb" x="'+(ax+7)+'" y="'+((ay+oy)/2+4)+'" text-anchor="start">'+f.hauteur+' '+u+'</text></svg>'
  }
  if (f.type === 'trapeze') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.grande_base,(S-2*P)/f.hauteur)*0.82
    const GB=f.grande_base*sc,PB=f.petite_base*sc,H=f.hauteur*sc,ox=(S-GB)/2,oy=S-P,off=(GB-PB)/2
    return open+'<polygon class="fig-sh" points="'+ox+','+oy+' '+(ox+GB)+','+oy+' '+(ox+GB-off)+','+(oy-H)+' '+(ox+off)+','+(oy-H)+'"/><text class="fig-lb" x="'+(S/2)+'" y="'+(oy+14)+'" text-anchor="middle">'+f.grande_base+' '+u+'</text></svg>'
  }
  if (f.type === 'parallelogramme') {
    const u=f.unite||'cm',sc=Math.min((S-2*P)/f.base,(S-2*P)/f.hauteur)*0.78
    const W=f.base*sc,H=f.hauteur*sc,sh=H*0.5,ox=P,oy=S-P
    return open+'<polygon class="fig-sh" points="'+(ox+sh)+','+(oy-H)+' '+(ox+sh+W)+','+(oy-H)+' '+(ox+W)+','+oy+' '+ox+','+oy+'"/><text class="fig-lb" x="'+(ox+sh/2+W/2)+'" y="'+(oy+14)+'" text-anchor="middle">'+f.base+' '+u+'</text></svg>'
  }
  return ''
}

function renderTableauHTML(tableau) {
  if (!tableau) return ''
  var t = tableau
  if (typeof t === 'string') { try { t = JSON.parse(t) } catch(e) { return '' } }
  if (!t || !t.headers || !t.rows) return ''
  return '<table class="q-tableau"><tr>'+t.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+t.rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</table>'
}

// ═══════════════════════════════════════════════════
// RENDU GRAPHIQUE — repris de quiz.html le 26/08/2026, pour vérifier
// visuellement le rendu réel d'une question sans passer par un quiz élève.
// Toujours affiché en graphique quand un motif est détecté (jamais en
// tableau alterné aléatoirement, contrairement à quiz.html) : c'est un
// outil d'audit, pas une expérience élève. Mêmes fonctions de détection
// et de parsing que quiz.html, pour garantir un rendu identique.
// ═══════════════════════════════════════════════════
function detecterTypeGraphique(tableau){
  if(!tableau)return null
  var t=tableau;if(typeof t==='string'){try{t=JSON.parse(t)}catch(e){return null}}
  if(!t||!t.headers||!t.rows||t.rows.length===0)return null
  if(t.rows.length>1)return null
  var premierHeader=(t.headers[0]||'').toLowerCase()
  var premiereRow=(t.rows[0][0]||'').toLowerCase()
  if(premierHeader==='x'&&/^[a-z]\(x\)$/.test(premiereRow.replace(/\s+/g,'')))return 'fonction'
  if(premiereRow==='effectif')return 'barres'
  if(premiereRow==='fréquence'||premiereRow==='frequence')return 'barres'
  return null
}

function estCaseATrouver(v){return String(v===null||v===undefined?'':v).replace(/[\s\u00A0\u202F]/g,'')==='?'}

function nombreTableau(v){
  if(typeof v==='number')return isFinite(v)?v:null
  if(v===null||v===undefined)return null
  var s=String(v).replace(/\u2212/g,'-').replace(/[\s\u00A0\u202F]/g,'').replace(/,/g,'.')
  if(s==='')return null
  var n=parseFloat(s)
  return isFinite(n)?n:null
}

// Adapte le mot « tableau » de l'énoncé quand la question est affichée en
// graphique — même règle que adapterEnonce() dans quiz.html (4 formules
// fermées, jamais le mot « tableau » isolé employé comme objet mathématique).
function adapterEnonceProf(question, tableau){
  var type=detecterTypeGraphique(tableau)
  if(!type)return question
  var mot=type==='barres'?'diagramme':'graphique'
  return question.replace(/\b(le|du)(\s+)tableau(\s+)(ci-dessous|suivant)\b/gi,function(m,det,e1,e2,suf){return det+e1+mot+e2+suf})
}

// Énoncés VVF (« Pour chaque affirmation… ») : un retour à la ligne avant chaque « Affirmation N : » et avant la
// question finale. Affichage uniquement — le texte en base est intact. Identique dans quiz.html et prof.html.
function formaterVVF(texte){
  var t=String(texte==null?'':texte)
  if(!/Affirmation\s+1\s*:/.test(t))return t
  return t.replace(/\s+(Affirmation\s+\d+\s*:)/g,'<br>$1').replace(/\s+(Quelle suite est correcte)/,'<br>$1')
}

// Instances Chart.js actives dans la banque, détruites à chaque
// (re)chargement de chargerBanque() — sans ça, Chart.js lève "Canvas is
// already in use" dès qu'on change de filtre ou de page.
let PROF_CHARTS = {}

function renderGraphiqueProf(tableau, qId){
  if(!tableau)return ''
  var t=tableau;if(typeof t==='string'){try{t=JSON.parse(t)}catch(e){return ''}}
  if(!t||!t.headers||!t.rows||t.rows.length===0)return ''
  var type=detecterTypeGraphique(t);if(!type)return renderTableauHTML(tableau)
  var chartId='pchart-q-'+qId
  var labels=t.headers.slice(1);var brutes=t.rows[0].slice(1);var values=brutes.map(nombreTableau)
  var illisibles=values.filter(function(n){return n===null}).length
  var anormales=values.filter(function(n,k){return n===null&&!estCaseATrouver(brutes[k])}).length
  if(anormales)console.warn('[banque][graphique] '+anormales+'/'+values.length+' valeur(s) non convertible(s) question '+qId,brutes)
  if(illisibles===values.length)return renderTableauHTML(tableau)
  var points=null
  if(type==='fonction'){
    var xValues=labels.map(nombreTableau)
    points=[]
    for(var k=0;k<xValues.length;k++){
      if(xValues[k]===null)continue
      points.push({x:xValues[k],y:values[k]})
    }
    if(points.length===0)return renderTableauHTML(tableau)
  }
  var height=type==='fonction'?170:140
  if(PROF_CHARTS[chartId]){PROF_CHARTS[chartId].destroy();delete PROF_CHARTS[chartId]}
  var html='<div style="height:'+height+'px;margin:8px 0"><canvas id="'+chartId+'"></canvas></div>'
  setTimeout(function(){
    var canvas=document.getElementById(chartId);if(!canvas)return
    var config={}
    if(type==='barres'){config={type:'bar',data:{labels:labels,datasets:[{data:values,backgroundColor:'#1B2A4A',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:t.headers[0],font:{size:10}}},y:{title:{display:true,text:t.rows[0][0],font:{size:10}},ticks:{stepSize:1},beginAtZero:true}}}}}
    else if(type==='fonction'){config={type:'line',data:{datasets:[{data:points,borderColor:'#1B2A4A',backgroundColor:'#1B2A4A',borderWidth:2,pointRadius:3,pointBackgroundColor:'#1B2A4A',tension:0}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{left:28}},plugins:{legend:{display:false}},scales:{x:{type:'linear',title:{display:true,text:'x',font:{size:10}}},y:{position:{x:0},title:{display:true,text:t.rows[0][0],font:{size:10}}}}}}}
    PROF_CHARTS[chartId]=new Chart(canvas,config)
  },50)
  return html
}

// ═══════════════════════════════════════════════════
// BANQUE
// ═══════════════════════════════════════════════════
async function chargerBanque() {
  const el = document.getElementById('banque-list')
  if (!el) return
  Object.values(PROF_CHARTS).forEach(c => c.destroy())
  PROF_CHARTS = {}
  el.innerHTML = '<div class="loader">Chargement…</div>'
  let query = sb.from('questions_banque').select('*').order('theme').order('difficulte')
  if (banqueFiltre.theme) query = query.eq('theme', banqueFiltre.theme)
  if (banqueFiltre.sousTheme) query = query.eq('sous_theme', banqueFiltre.sousTheme)
  if (banqueFiltre.diff)  query = query.eq('difficulte', banqueFiltre.diff)
  const { data, error } = await query
  if (error) { el.innerHTML='<div class="empty">Erreur : '+escHtml(error.message)+'</div>'; return }
  let filtered = data || []
  if (banqueFiltre.search) {
    const s = banqueFiltre.search.toLowerCase()
    // Union volontaire id OU texte : une saisie purement numerique cherche l'id ET continue
    // de chercher dans les enonces. Sans l'union, chercher « 2024 » cesserait de trouver les
    // questions dont l'enonce contient 2024 — une regression silencieuse sur la recherche texte.
    filtered = filtered.filter(q => String(q.id) === s || q.question.toLowerCase().includes(s))
  }
  BANQUE_DATA = filtered
  const total = filtered.length
  const start = banqueFiltre.page * PER_PAGE
  const page  = filtered.slice(start, start + PER_PAGE)
  // Le bandeau doit sortir AUSSI dans la branche « aucun resultat » : c'est precisement le cas
  // ou l'utilisateur, filtres remis a zero sans le voir, ne comprendrait pas la liste affichee.
  const notice = banqueFiltre.resetParId
    ? '<div class="banque-notice">🔎 Recherche de l\'id <strong>#'+esc(banqueFiltre.search)+'</strong> — les filtres domaine, sous-thème et difficulté ont été remis à zéro pour chercher dans toute la banque.</div>'
    : ''
  if (!page.length) { el.innerHTML=notice+'<div class="empty">Aucune question trouvée.</div>'; return }
  let html = notice
  page.forEach(q => {
    const opts = typeof q.opts === 'string' ? JSON.parse(q.opts) : (q.opts || [])
    const letters = ['A','B','C','D']
    const hasFigSVG = q.figure && q.figure.type
    const hasFigURL = q.figure_url
    const hasTab    = q.tableau
    const typeGraph = hasTab ? detecterTypeGraphique(q.tableau) : null
    const texteAffiche = typeGraph ? adapterEnonceProf(q.question, q.tableau) : q.question
    const estArchive = q.statut === 'archive'
    html += '<div class="q-card" id="qcard-'+q.id+'"'+(estArchive?' style="opacity:0.55"':'')+'>'
    html += '<div class="q-card-header"><div>'
    html += '<div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap">'
    html += '<span class="badge badge-blue">'+escHtml(q.theme)+'</span>'
    if (q.sous_theme) html += '<span class="badge" style="background:#f0f0f5;color:#555">'+escHtml(q.sous_theme)+'</span>'
    html += '<span class="badge '+(q.difficulte==='facile'?'badge-tb':q.difficulte==='moyen'?'badge-ab':'badge-insuf')+'">'+escHtml(q.difficulte)+'</span>'
    if (estArchive) html += '<span class="badge" style="background:#f0f0f0;color:#888">📦 Archivée</span>'
    if (hasFigSVG) html += '<span class="badge" style="background:#f0f0ff;color:#3730a3">🔷 Figure SVG</span>'
    if (hasFigURL) html += '<span class="badge" style="background:#fff0f0;color:#9E2B25">🖼 Image</span>'
    if (hasTab)    html += '<span class="badge badge-banque">📊 Tableau</span>'
    html += '</div>'
    html += '<div class="q-card-text">'+formaterVVF(texteAffiche)+'</div>'
    html += '</div>'
    html += '<div class="q-card-right">'
    html += '<span class="q-card-id" title="id de la question">'+q.id+'</span>'
    html += '<div class="q-card-actions">'
    html += '<button class="btn btn-sm btn-blue" onclick="ouvrirEdit('+q.id+',\'questions_banque\')">✏️ Modifier</button>'
    html += '<label class="btn btn-sm btn-amber" style="cursor:pointer">🖼 Image<input type="file" accept="image/*" style="display:none" onchange="uploadFigure(event,'+q.id+',\'questions_banque\')"></label>'
    if (hasFigSVG || hasFigURL) html += '<button class="btn btn-sm btn-red" onclick="supprimerFigure('+q.id+',\'questions_banque\')">🗑 Figure</button>'
    html += '</div></div></div>'
    if (hasFigSVG) { const svg = renderFigureSVG(q.figure); if (svg) html += '<div class="q-figure">'+svg+'</div>' }
    if (hasFigURL) html += '<div class="q-figure"><img src="'+escHtml(q.figure_url)+'" alt="figure"></div>'
    if (hasTab)    html += typeGraph ? renderGraphiqueProf(q.tableau, q.id) : renderTableauHTML(q.tableau)
    html += '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px">'
    opts.forEach((opt, i) => {
      const correct = i === q.answer
      html += '<div style="font-size:11px;padding:4px 8px;border-radius:6px;background:'+(correct?'#EAF6EF':'#F7F6F1')+';color:'+(correct?'#2F9E5C':'#555')+';border:1px solid '+(correct?'#86efac':'#e8e8e4')+'">'
      html += '<strong>'+letters[i]+'.</strong> '+opt+(correct?' ✓':'')+'</div>'
    })
    html += '</div></div>'
  })
  const totalPages = Math.ceil(total / PER_PAGE)
  html += '<div class="pagination">'
  html += '<button class="btn btn-sm" onclick="banquePage(-1)" '+(banqueFiltre.page===0?'disabled':'')+'>← Préc</button>'
  html += '<span style="color:var(--muted)">Page '+(banqueFiltre.page+1)+' / '+totalPages+' ('+total+' questions)</span>'
  html += '<button class="btn btn-sm" onclick="banquePage(1)" '+(banqueFiltre.page>=totalPages-1?'disabled':'')+'>Suiv →</button>'
  html += '</div>'
  el.innerHTML = html
}

function banquePage(dir) { banqueFiltre.page += dir; chargerBanque() }

function estRechercheId(s) { return /^[0-9]+$/.test(s) }

// origine === 'search' : appel declenche par la frappe dans le champ de recherche, seul cas ou
// la remise a zero des filtres est legitime. Les selects appellent filtrerBanque() sans argument,
// pour qu'un choix de domaine fait APRES une recherche par id ne soit pas efface aussitot.
function filtrerBanque(origine) {
  banqueFiltre.theme  = document.getElementById('filtre-theme').value
  banqueFiltre.sousTheme = document.getElementById('filtre-sous-theme').value
  banqueFiltre.diff   = document.getElementById('filtre-diff').value
  banqueFiltre.search = document.getElementById('filtre-search').value.trim()
  banqueFiltre.page   = 0
  banqueFiltre.resetParId = false
  // Les trois filtres sont appliques dans la requete Supabase, pas cote client : sans cette
  // remise a zero, un id appartenant a un autre domaine que le filtre courant renverrait
  // « Aucune question trouvée » alors que la question existe.
  if (origine === 'search' && estRechercheId(banqueFiltre.search) && (banqueFiltre.theme || banqueFiltre.sousTheme || banqueFiltre.diff)) {
    banqueFiltre.theme = ''
    banqueFiltre.sousTheme = ''
    banqueFiltre.diff = ''
    document.getElementById('filtre-theme').value = ''
    document.getElementById('filtre-diff').value = ''
    renderFiltreSousTheme()
    banqueFiltre.resetParId = true
  }
  chargerBanque()
}

function onChangeFiltreTheme() {
  banqueFiltre.theme = document.getElementById('filtre-theme').value
  banqueFiltre.sousTheme = ''
  renderFiltreSousTheme()
  filtrerBanque()
}

function renderFiltreSousTheme() {
  const sel = document.getElementById('filtre-sous-theme')
  if (!sel) return
  const liste = SOUS_THEMES[banqueFiltre.theme] || []
  sel.innerHTML = '<option value="">Tous les sous-thèmes</option>' + liste.map(st => '<option value="'+st+'">'+st+'</option>').join('')
  sel.disabled = !banqueFiltre.theme
}

async function uploadFigure(event, id, table) {
  const file = event.target.files[0]
  if (!file) return
  const ext = file.name.split('.').pop()
  const path = table+'/'+id+'.'+ext
  const { error: upErr } = await sb.storage.from('figures').upload(path, file, { upsert: true })
  if (upErr) { alert('Erreur upload : '+upErr.message); return }
  const { data: urlData } = sb.storage.from('figures').getPublicUrl(path)
  const url = urlData.publicUrl
  const { error: dbErr } = await sb.from(table).update({ figure_url: url }).eq('id', id)
  if (dbErr) { alert('Erreur sauvegarde : '+dbErr.message); return }
  alert('✅ Image uploadée !')
  chargerBanque()
}

async function supprimerFigure(id, table) {
  if (!confirm('⚠️ Supprimer UNIQUEMENT la figure (pas la question) ?')) return
  const { data, error } = await sb.from(table).update({ figure: null, figure_url: null }).eq('id', id).select('id, question')
  if (error) { alert('Erreur : '+error.message); return }
  if (!data || data.length === 0) { alert('⚠️ Mise à jour impossible — vérifier les permissions Supabase'); return }
  chargerBanque()
}

async function ouvrirEdit(id, table) {
  editCurrentId = id; editCurrentTable = table
  const { data, error } = await sb.from(table).select('*').eq('id', id).single()
  if (error || !data) { alert('Erreur chargement question'); return }
  const opts = typeof data.opts === 'string' ? JSON.parse(data.opts) : (data.opts || ['','','',''])
  const letters = ['A','B','C','D']
  let html = ''
  html += '<div class="field"><label>Question</label><textarea id="edit-question" style="min-height:80px">'+escHtml(data.question)+'</textarea></div>'
  html += '<div style="margin-bottom:12px">'
  letters.forEach((l,i) => {
    html += '<div class="opt-row"><label>'+l+'</label><input type="text" id="edit-opt'+l+'" value="'+escHtml(opts[i]||'')+'"><label class="radio-label"><input type="radio" name="edit-bonne" value="'+i+'" '+(data.answer===i?'checked':'')+'>  Bonne</label></div>'
  })
  html += '</div>'
  html += '<div class="field"><label>Explication</label><textarea id="edit-explication" style="min-height:80px">'+escHtml(data.explication)+'</textarea></div>'
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
  html += '<button class="btn btn-green" onclick="sauvegarderEdit()">💾 Sauvegarder</button>'
  html += '<button class="btn btn-red" onclick="supprimerQuestion()">🗑 Supprimer la question</button>'
  html += '<button class="btn" onclick="closeEdit()">Annuler</button>'
  html += '</div>'
  html += '<div id="edit-msg" style="margin-top:10px;font-size:13px"></div>'
  document.getElementById('edit-body').innerHTML = html
  document.getElementById('overlay-edit').classList.add('active')
}

function closeEdit() { document.getElementById('overlay-edit').classList.remove('active') }

async function sauvegarderEdit() {
  const question = document.getElementById('edit-question').value.trim()
  const explication = document.getElementById('edit-explication').value.trim()
  const bonneVal = document.querySelector('input[name="edit-bonne"]:checked')?.value
  const letters = ['A','B','C','D']
  const opts = letters.map(l => document.getElementById('edit-opt'+l).value.trim())
  const msg = document.getElementById('edit-msg')
  if (!question || opts.some(o=>!o) || bonneVal === undefined || !explication) {
    msg.innerHTML = '<span style="color:#9E2B25">⚠ Remplis tous les champs.</span>'; return
  }
  msg.innerHTML = '<span style="color:#888">Sauvegarde…</span>'
  const { error } = await sb.from(editCurrentTable).update({ question, opts: JSON.stringify(opts), answer: parseInt(bonneVal), explication }).eq('id', editCurrentId)
  if (error) { msg.innerHTML = '<span style="color:#9E2B25">Erreur : '+escHtml(error.message)+'</span>' }
  else { msg.innerHTML = '<span style="color:#2F9E5C">✓ Sauvegardé !</span>'; setTimeout(() => { closeEdit(); chargerBanque() }, 1000) }
}

// ── Bloc « Offre » (statut Accompagné, lot 1 du gating) ─────────────
// Règle identique à public.est_accompagne() (db/accompagne.sql) et à
// estAccompagne() de lib/gating.js (copie : cette page n'importe pas lib/).
// Écriture uniquement par la fonction SQL definir_offre_eleve() (prof), jamais
// par un UPDATE : aucun droit UPDATE sur ces deux colonnes.
function dateParisAujourdhui() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' }).format(new Date()) // AAAA-MM-JJ
}
function dateJJMMAAAA(iso) { // « AAAA-MM-JJ » → « JJ/MM/AAAA », sans objet Date (pas de fuseau)
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''))
  return m ? m[3] + '/' + m[2] + '/' + m[1] : ''
}
// Motif affiché : abonnement > cours particuliers > accès offert ; null = Libre.
function statutOffre(p) {
  p = p || {}
  if (p.plan_actif === true) return 'abonnement'
  if (p.cours_particuliers_actif === true) return 'cours'
  if (typeof p.acces_offert_jusqu === 'string' && p.acces_offert_jusqu.slice(0, 10) >= dateParisAujourdhui()) return 'acces'
  return null
}
function libelleBadgeOffre(p) {
  const m = statutOffre(p)
  if (m === 'abonnement') return 'Accompagné · abonnement'
  if (m === 'cours') return 'Accompagné · cours particuliers'
  if (m === 'acces') return 'Accompagné · accès offert jusqu\'au ' + dateJJMMAAAA(p.acces_offert_jusqu)
  return 'Libre'
}
function majBadgeOffre(userId) {
  const b = document.getElementById('offre-badge')
  if (!b) return
  const p = PROFILS[userId] || {}
  b.textContent = libelleBadgeOffre(p)
  b.classList.toggle('accompagne', statutOffre(p) !== null)
}
function blocOffre(userId) {
  const p = PROFILS[userId] || {}
  const acc = statutOffre(p) !== null
  const id = escAttrJs(userId)
  return '<section class="offre-bloc" aria-labelledby="offre-titre">' +
    '<div class="offre-tete"><div class="offre-titre" id="offre-titre">OFFRE</div>' +
    '<span class="offre-badge' + (acc ? ' accompagne' : '') + '" id="offre-badge">' + escHtml(libelleBadgeOffre(p)) + '</span></div>' +
    '<div class="offre-ligne"><span>Abonnement payé</span><strong>' + (p.plan_actif === true ? 'oui' : 'non') + '</strong></div>' +
    '<label class="offre-ligne offre-case"><input type="checkbox" id="offre-cours"' + (p.cours_particuliers_actif === true ? ' checked' : '') + '> Cours particuliers en cours</label>' +
    '<div class="offre-ligne"><label for="offre-date">Accès offert jusqu\'au</label>' +
    '<input type="date" id="offre-date" value="' + escHtml(String(p.acces_offert_jusqu || '').slice(0, 10)) + '"></div>' +
    '<div class="offre-actions"><button type="button" class="btn btn-blue" id="offre-save" onclick="enregistrerOffre(\'' + id + '\')">Enregistrer</button>' +
    '<button type="button" class="btn" id="offre-retirer" onclick="retirerAcces(\'' + id + '\')">Retirer l\'accès</button></div>' +
    '<div class="offre-msg" id="offre-msg" role="status" aria-live="polite"></div></section>'
}
function messageOffre(texte, ok) {
  const m = document.getElementById('offre-msg')
  if (!m) return
  m.textContent = texte
  m.className = 'offre-msg ' + (ok ? 'ok' : 'err')
}
async function appliquerOffre(userId, cours, accesJusqu) {
  const boutons = ['offre-save', 'offre-retirer'].map(i => document.getElementById(i))
  boutons.forEach(b => { if (b) b.disabled = true })
  messageOffre('', true)
  const { data, error } = await sb.rpc('definir_offre_eleve', { p_user_id: userId, p_cours: cours, p_acces_jusqu: accesJusqu })
  if (ficheEnCours !== userId) return // fiche fermée, ou autre élève ouvert entre-temps
  boutons.forEach(b => { if (b) b.disabled = false })
  const ligne = Array.isArray(data) ? data[0] : data
  if (error || !ligne) {
    console.error('[offre] definir_offre_eleve impossible :', error && error.message)
    messageOffre('Impossible d\'enregistrer' + (error && error.message ? ' : ' + error.message : '.'), false)
    return
  }
  const p = PROFILS[userId] || (PROFILS[userId] = {})
  p.cours_particuliers_actif = ligne.cours_actif === true
  p.acces_offert_jusqu = ligne.acces_jusqu || null
  const c = document.getElementById('offre-cours'), d = document.getElementById('offre-date')
  if (c) c.checked = p.cours_particuliers_actif
  if (d) d.value = String(p.acces_offert_jusqu || '').slice(0, 10)
  majBadgeOffre(userId)
  messageOffre('Enregistré.', true)
}
function enregistrerOffre(userId) {
  const c = document.getElementById('offre-cours'), d = document.getElementById('offre-date')
  appliquerOffre(userId, !!(c && c.checked), (d && d.value) || null)
}
// Vide la date ; garde la valeur ENREGISTRÉE de « cours » (pas l'état de la case).
function retirerAcces(userId) {
  const p = PROFILS[userId] || {}
  appliquerOffre(userId, p.cours_particuliers_actif === true, null)
}

async function openFiche(userId) {
  const e = ELEVES.find(x => x.user_id === userId)
  if (!e) return
  ficheEnCours = userId
  document.getElementById('fiche-titre').textContent = e.prenom + ' ' + e.nom
  const corps = document.getElementById('fiche-body')
  corps.innerHTML = '<div class="loader" style="padding:2rem 1rem">Chargement…</div>'
  document.getElementById('overlay').classList.add('active')

  const { data, error } = await sb.from('niveaux_sous_theme')
    .select(Niveaux.SELECT_NIVEAUX)
    .eq('user_id', userId)
  if (ficheEnCours !== userId) return // fiche fermée, ou autre élève ouvert entre-temps

  let contenu
  if (error) {
    console.error('[niveaux] lecture de niveaux_sous_theme impossible (fiche) :', error.message)
    contenu = '<p class="empty" style="color:var(--red)">Impossible de charger le niveau atteint pour le moment.</p>'
  } else if (!data || data.length === 0) {
    contenu = '<p class="empty">Aucune session terminée pour l\'instant.</p>'
  } else {
    contenu = Niveaux.rendreCarteNiveaux(data, { cta: false })
  }

  // Bouton bilan : seulement si l'élève a au moins une ligne dans resultats
  // (abandons compris) — même garde-fou qu'avant, quand l'alerte « Pas encore
  // de données » empêchait d'ouvrir la fiche d'un élève sans aucune session.
  let pied = '<div style="margin-top:1.5rem;padding-top:12px;border-top:1px solid var(--border)">' +
    '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">PROF UNIQUEMENT</div>' +
    '<a href="#" style="font-size:13px;font-weight:500;color:var(--blue)" onclick="voirRateesEleve(\''+escAttrJs(userId)+'\');return false">Voir ses questions ratées et son activité →</a></div>'
  pied += '<div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap">'
  if (ROWS.some(r => r.user_id === userId)) {
    pied += '<button class="btn btn-green" id="btn-bilan" onclick="envoyerBilan(\''+escAttrJs(userId)+'\')">Envoyer bilan parents</button>'
    pied += '<button class="btn" onclick="ouvrirApercuBilan(\''+escAttrJs(userId)+'\')">Aperçu du bilan</button>'
  }
  pied += '<button class="btn" onclick="closeFiche()">Fermer</button></div>'
  corps.innerHTML = blocOffre(userId) + contenu + pied
}

// Bilan parents (lot 3, 20/10/2026) : le navigateur n'envoie plus que
// l'identifiant de l'élève. Destinataire, niveaux (vue niveaux_sous_theme) et
// activité sont calculés côté serveur (api/email.js, lib/bilan-email.js), le
// même email complet que le bilan automatique de 21 jours. Hors production, le
// serveur n'envoie qu'à l'adresse de test (EMAIL_TEST_DESTINATAIRE).
async function envoyerBilan(userId) {
  const e = ELEVES.find(x => x.user_id === userId)
  if (!e?.email_parent || e.email_parent === '—') { alert("Pas d'email parent pour cet élève."); return }
  const btn = document.getElementById('btn-bilan')
  const libelle = 'Envoyer bilan parents'
  btn.disabled = true; btn.textContent = 'Envoi…'
  try {
    const res = await appelerEmail({ type: 'bilan', user_id: userId }, { brut: true })
    const data = await res.json().catch(() => ({}))
    if (data.raison === 'desabonne') { alert('Parent désabonné : bilan non envoyé.'); btn.disabled=false; btn.textContent=libelle }
    else if (res.ok && data.success) {
      btn.textContent = data.test ? 'Envoyé ✓ (adresse de test)' : 'Envoyé ✓'
      setTimeout(()=>{ btn.disabled=false; btn.textContent=libelle },3000)
    }
    else throw new Error(data.error || ('statut ' + res.status))
  } catch(err) { alert('Erreur : '+err.message); btn.disabled=false; btn.textContent=libelle }
}

// Aperçu du bilan sans envoi (iframe sandbox, srcdoc). Complet ou tronqué au choix.
let apercuUserId = null
async function ouvrirApercuBilan(userId) {
  apercuUserId = userId
  document.getElementById('apercu-version').value = 'complet'
  document.getElementById('overlay-apercu').classList.add('active')
  await chargerApercu()
}
async function chargerApercu() {
  const uid = apercuUserId
  if (!uid) return
  const frame = document.getElementById('apercu-frame')
  const msg = document.getElementById('apercu-msg')
  const sujet = document.getElementById('apercu-sujet')
  frame.srcdoc = ''; sujet.textContent = ''; msg.textContent = 'Chargement…'
  try {
    const version = document.getElementById('apercu-version').value
    const res = await appelerEmail({ type: 'bilan', user_id: uid, apercu: true, version }, { brut: true })
    const data = await res.json().catch(() => ({}))
    if (apercuUserId !== uid) return // fermé ou changé entre-temps
    if (!res.ok || !data.success) throw new Error(data.error || ('statut ' + res.status))
    sujet.textContent = 'Objet : ' + data.sujet
    frame.srcdoc = data.html
    msg.textContent = ''
  } catch(err) {
    if (apercuUserId !== uid) return
    msg.textContent = 'Aperçu impossible : ' + err.message
  }
}
function closeApercu() {
  apercuUserId = null
  document.getElementById('overlay-apercu').classList.remove('active')
  document.getElementById('apercu-frame').srcdoc = ''
