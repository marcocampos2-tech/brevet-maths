  ELEVES.forEach(e=>{
    const st=statsEleve(e.user_id), ex=st.dernierExamen
    const examCell=ex?'<strong>'+escHtml(ex.score)+'/20</strong> <span style="font-size:11px;color:var(--muted)">· '+dateStr(ex.created_at)+'</span>':'<span style="color:#999;font-size:12px">Aucun</span>'
    const actCell=st.derniereActivite?dateStr(st.derniereActivite):'<span style="color:#999">—</span>'
    h+='<tr><td><div class="eleve-cell"><div class="avatar">'+escHtml(initiales(e.prenom,e.nom))+'</div><button type="button" class="nom-eleve" onclick="openFiche(\''+escAttrJs(e.user_id)+'\')">'+escHtml(e.prenom)+' '+escHtml(e.nom)+'</button></div></td><td style="color:var(--blue);font-size:12px">'+escHtml(e.email_parent)+'</td><td>'+st.terminees+'</td><td>'+st.interrompues+'</td><td style="white-space:nowrap">'+fmtTemps(st.dureeSec)+'</td><td style="white-space:nowrap">'+examCell+'</td><td style="font-size:12px;white-space:nowrap">'+actCell+'</td><td style="font-size:12px;white-space:nowrap">'+origineLabel(e.source)+'</td>'
    h+='<td><button class="btn btn-sm btn-blue" onclick="openFiche(\''+escAttrJs(e.user_id)+'\')">Fiche</button></td></tr>'
  })
  h+='</tbody></table></div></div></div>'

  // EXAMENS BLANCS — abandons inclus comme lignes distinctes (jamais 0/20,
  // cf. docs/TODO.md pour le même défaut côté email parent, pas reproduit ici).
  // EXAMENS est déjà l'ensemble complet trié desc sur created_at (requête
  // ligne ~1760) : pas de refiltrage/retri ici.
  h+='<div class="section" id="sec-examens"><div class="card"><div class="card-title">Résultats Examens En Ligne</div>'
  if (!EXAMENS.length) { h+='<p class="empty">Aucun examen passé.</p>' }
  else {
    h+='<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Élève</th><th>Score</th><th>Mention</th><th>Temps</th><th>Nombres</th><th>Organisation</th><th>Géométrie</th><th>Grandeurs</th></tr></thead><tbody>'
    EXAMENS.forEach(e=>{
      const p=pct(e.score,e.total),th=e.scores_themes||{},sc=scoresExamen(th)
      const mins=Math.floor(e.temps_secondes/60),secs=e.temps_secondes%60
      const profil=PROFILS[e.user_id],nom=profil?profil.prenom_affiche+' '+profil.nom_affiche:(e.user_id===userIdCourant?'Prof':(e.prenom||'—'))
      const scoreCell=e.abandonne?'<span style="color:#999">Abandonné</span>':'<strong>'+escHtml(e.score)+'/20</strong> <span style="font-size:11px;color:'+(p>=50?'#2F9E5C':'#9E2B25')+'">'+p+'%</span>'
      const mentionCell=e.abandonne?'':mentionBadge(p)
      h+='<tr><td style="font-size:12px;color:#999">'+dateStr(e.created_at)+'</td><td><strong>'+escHtml(nom)+'</strong></td>'
      h+='<td>'+scoreCell+'</td><td>'+mentionCell+'</td><td style="font-size:12px">'+fmt(mins,secs)+'</td>'
      h+='<td style="text-align:center;font-size:12px">'+escHtml(sc.nombres)+'</td><td style="text-align:center;font-size:12px">'+escHtml(sc.stats)+'</td>'
      h+='<td style="text-align:center;font-size:12px">'+escHtml(sc.geo)+'</td><td style="text-align:center;font-size:12px">'+escHtml(sc.grandeurs)+'</td></tr>'
    })
    h+='</tbody></table></div>'
  }
  h+='</div></div>'

  // INSCRIPTIONS
  h+='<div class="section" id="sec-inscriptions"><div class="card"><div class="card-title">📋 Inscriptions Examen Blanc Présentiel</div>'
  h+='<div id="inscriptions-list"><div class="loader">Chargement…</div></div>'
  h+='</div></div>'

  // STAGES
  h+='<div class="section" id="sec-stages"><div class="card"><div class="card-title">🎒 Stages Vacances</div>'
  h+='<div id="stages-list"><div class="loader">Chargement…</div></div>'
  h+='</div></div>'

  // THÈMES
  h+='<div class="section" id="sec-themes"><div class="card"><div class="card-title">Résultats par domaine</div>'
  h+='<table class="tbl"><thead><tr><th>Domaine</th><th>Sessions</th><th>Moyenne</th></tr></thead><tbody>'
  Object.entries(themeStats).forEach(([t,s])=>{ const p=pct(s.ok,s.tot); h+='<tr><td>'+escHtml(t)+'</td><td>'+s.n+'</td><td><strong style="color:'+color(p)+'">'+p+'%</strong></td></tr>' })
  h+='</tbody></table></div></div>'

  // SESSIONS
  h+='<div class="section" id="sec-sessions"><div class="card"><div class="card-title">30 dernières activités</div>'
  h+='<table class="tbl"><thead><tr><th>Élève</th><th>Type</th><th>Détail</th><th>Score</th><th>Date</th></tr></thead><tbody>'
  const toutesActivites=[...ROWS.map(r=>({user_id:r.user_id,type:'quiz',detail:r.theme+' — '+r.difficulte,score:r.score,total:r.total,abandonne:r.abandonne,created_at:r.created_at})),...EXAMENS.filter(e=>!e.abandonne).map(e=>({user_id:e.user_id,type:'examen',detail:'Examen blanc',score:e.score,total:e.total,abandonne:e.abandonne,created_at:e.created_at}))]
  toutesActivites.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,30).forEach(r=>{
    const profil=PROFILS[r.user_id],nom=profil?profil.prenom_affiche+' '+profil.nom_affiche:'—',p=pct(r.score,r.total)
    const typeBadge=r.type==='examen'?'<span class="badge badge-blue">📝 Examen en ligne</span>':'<span class="badge badge-banque">🎲 Quiz</span>'
    const scoreCell=r.abandonne?'<span style="color:#999">Abandonné</span>':'<strong style="color:'+color(p)+'">'+escHtml(r.score)+'/'+escHtml(r.total)+'</strong>'
    h+='<tr><td><strong>'+escHtml(nom)+'</strong></td><td>'+typeBadge+'</td><td style="font-size:12px;color:#555">'+escHtml(r.detail)+'</td>'
    h+='<td>'+scoreCell+'</td><td style="font-size:12px;color:#999">'+dateStr(r.created_at)+'</td></tr>'
  })
  h+='</tbody></table></div></div>'

  // QUESTIONS RATÉES — contenu rempli par renderRatees() à l'ouverture de l'onglet
  h+='<div class="section" id="sec-ratees"><div class="card"><div class="card-title">Questions ratées</div>'
  h+='<div class="field" style="max-width:340px;margin-bottom:1rem"><label for="ratees-eleve">Élève</label><select id="ratees-eleve" onchange="renderRatees()"><option value="">Tous les élèves</option>'
  ;[...ELEVES].sort((x,y)=>(x.prenom+' '+x.nom).localeCompare(y.prenom+' '+y.nom,'fr')).forEach(e=>{ h+='<option value="'+escHtml(e.user_id)+'">'+escHtml(e.prenom+' '+e.nom)+'</option>' })
  h+='</select></div><div id="ratees-contenu"></div></div></div>'

  // BANQUE
  h+='<div class="section" id="sec-banque">'
  h+='<div class="card"><div class="banque-filters">'
  h+='<select id="filtre-theme" onchange="onChangeFiltreTheme()"><option value="">Tous les domaines</option>'+THEMES.map(t=>'<option value="'+t+'">'+t+'</option>').join('')+'</select>'
  h+='<select id="filtre-sous-theme" onchange="filtrerBanque()" disabled><option value="">Tous les sous-thèmes</option></select>'
  h+='<select id="filtre-diff" onchange="filtrerBanque()"><option value="">Toutes difficultés</option><option value="facile">Facile</option><option value="moyen">Moyen</option><option value="difficile">Difficile</option></select>'
  h+='<input type="text" id="filtre-search" placeholder="🔍 Rechercher un énoncé ou un id…" oninput="filtrerBanque(\'search\')">'
  h+='</div></div>'
  h+='<div class="card"><div class="card-title">Questions de la banque</div><div id="banque-list"><div class="loader">Chargement…</div></div></div>'
  h+='<div class="card"><div class="card-title">➕ Ajouter une question</div>'
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
  h+='<div class="field"><label>Domaine</label><select id="bq-theme" onchange="renderBqSousTheme()">'+THEMES.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'
  h+='<div class="field"><label>Difficulté</label><select id="bq-diff"><option value="facile">Facile</option><option value="moyen" selected>Moyen</option><option value="difficile">Difficile</option></select></div>'
  h+='</div>'
  h+='<div class="field"><label>Sous-thème</label><select id="bq-sous-theme"></select></div>'
  h+='<div class="field"><label>Question</label><textarea id="bq-question" placeholder="Énoncé complet…"></textarea></div>'
  h+=['A','B','C','D'].map(l=>'<div class="opt-row"><label>'+l+'</label><input type="text" id="bq-opt'+l+'" placeholder="Option '+l+'"><label class="radio-label"><input type="radio" name="bq-bonne" value="'+l+'"> Bonne réponse</label></div>').join('')
  h+='<div class="field" style="margin-top:10px"><label>Explication</label><textarea id="bq-explication" placeholder="Correction étape par étape…"></textarea></div>'
  h+='<button class="btn btn-green" onclick="ajouterQuestion()">➕ Ajouter la question</button>'
  h+='<div id="bq-msg" style="margin-top:10px;font-size:13px"></div></div>'
  h+='</div>'

  document.getElementById('root').innerHTML = h
  renderBqSousTheme()
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
async function init() {
  const { data: { session } } = await sb.auth.getSession()
  // Modifié 17/08/2026 : plus de redirection vers index.html en l'absence
  // de session — on affiche le formulaire OTP intégré, prof.html reste
  // une page autonome (connexion et déconnexion sur place).
  if (!session) { renderLoginProf(); return }

  // Contrôle d'accès — révisé le 10/08/2026 (chantier RLS, étape 1)
  // Avant : vérification via user_metadata (modifiable par l'utilisateur) puis
  // fallback sur la table profils. Purement côté client, sans valeur de
  // sécurité réelle — l'accès aux données reste gouverné par is_prof() en base.
  // Après : vérification via app_metadata, seul champ du token non modifiable
  // par l'utilisateur lui-même (posé uniquement via service_role).
  // Étape 1 volontairement sans impact sur is_prof() : ce dernier reste la
  // véritable barrière RLS jusqu'à sa refonte (étape 2).
  if (session.user.app_metadata?.role !== 'prof') {
    document.getElementById('btn-logout-nav').style.display = 'none'
    document.getElementById('root').innerHTML =
      '<div class="denied">Accès réservé au professeur.' +
      '<div style="margin-top:1rem"><button class="btn btn-red btn-sm" onclick="logout()">Se déconnecter</button></div></div>'
    return
  }

  document.getElementById('btn-logout-nav').style.display = ''
  userIdCourant = session.user.id

  const [r1,r2,r3,r4,r5] = await Promise.all([
    sb.from('resultats').select('*').order('created_at',{ascending:false}),
    sb.from('examens_blancs').select('*').order('created_at',{ascending:false}),
    sb.from('profils').select('*'),
    sb.from('inscriptions_brevet').select('*').order('created_at',{ascending:true}),
    sb.from('sessions_examen_blanc').select('*').order('date_session',{ascending:true})
  ])
  ROWS=r1.data||[]; EXAMENS=r2.data||[]
  const profils=r3.data||[]
  PROFILS={}; profils.forEach(p=>PROFILS[p.user_id]=p)
  ELEVES=profils.map(p=>({user_id:p.user_id,prenom:p.prenom_affiche||'—',nom:p.nom_affiche||'',email_parent:p.email_parent||'—',source:p.source||null}))
  INSCRIPTIONS=r4.data||[]
  SESSIONS=r5.data||[]
  render()
}

init()
</script>
